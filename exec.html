function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inlineMd(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')}
function mdToHtml(md){var lines=String(md||'').replace(/\r\n/g,'\n').split('\n'),html='',inList=false,inTable=false,table=[];function closeList(){if(inList){html+='</ul>';inList=false}}function closeTable(){if(!inTable)return;html+='<div class="table-wrap"><table>';for(var i=0;i<table.length;i++){var cells=table[i].split('|').slice(1,-1).map(function(c){return c.trim()});if(i===1&&cells.every(function(c){return /^:?-{3,}:?$/.test(c)}))continue;html+='<tr>'+(i===0?cells.map(function(c){return '<th>'+inlineMd(c)+'</th>'}).join(''):cells.map(function(c){return '<td>'+inlineMd(c)+'</td>'}).join(''))+'</tr>'}html+='</table></div>';inTable=false;table=[]}for(var i=0;i<lines.length;i++){var line=lines[i].trimEnd();if(!line){closeList();closeTable();continue}if(/^```/.test(line)){continue}if(/^\|.*\|$/.test(line)){closeList();inTable=true;table.push(line);continue}closeTable();if(/^#{1,6}\s+/.test(line)){closeList();var lv=line.match(/^#{1,6}/)[0].length;html+='<h'+lv+'>'+inlineMd(line.replace(/^#{1,6}\s+/,''))+'</h'+lv+'>';continue}if(/^[-*]\s+/.test(line)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}closeList();html+='<p>'+inlineMd(line)+'</p>'}closeList();closeTable();return html}

var issue=q('issue')||'未关联';var solution=q('solution')||'A';var project=q('project')||'hk-ttps-a';var projectName=projectMap[project]||project;
document.getElementById('meta').textContent='来源：评估结果 Issue #'+issue+' · 已选方案 '+solution;

document.getElementById('summary').innerHTML='本执行策划案按客户交付版模板生成，包含客户信息确认、核心策略、合规清理、资金路径、投资使用建议、财富架构、税务分析、身份路径、教育与福利规划、预算与三方费用、材料清单、办理流程图、风险声明、法律依据和法案相互影响总结。';

var md=`# 香港移民执行策划案\n\n> 生成日期：2026-06-08\n> 适用对象：拟通过香港入境计划取得香港居民身份的中国内地家庭/企业主\n> 文档版本：客户交付版 V1.0\n> 重要声明：本策划案为商业规划与执行框架，不构成法律、税务、投资或移民建议；落地前须由香港持牌移民顾问/律师进行最终确认。香港是中国的一个特别行政区，本方案中的"身份规划"指取得香港居民身份及后续永久居民身份，不涉及国籍变更。\n\n---\n\n## 摘要结论\n\n本方案建议客户以香港入境计划为主路径，根据客户背景在以下六大通道中精准匹配：\n\n- **CIES资本投资者入境计划**（HK$3,000万，2024年3月重启）——适合高净值企业主，无学历/语言要求\n- **TTPS-A高才通A类**（年收入≥HK$250万）——适合高收入企业主/高管，审批最快4周\n- **TTPS-B高才通B类**（百强本科学位+≥3年工作经验）——适合名校毕业+有经验的职场精英\n- **QMAS优才计划**（综合计分制12条≥6条）——适合综合条件优秀但不符合高才通/CIES的申请人\n- **ASMTP专才计划**（获香港雇主聘用或自雇创业）——适合已在港有业务或获雇主担保的申请人\n- **IANG**（非本地毕业生留港/回港）——适合港校或大湾区校园毕业生\n\n香港身份的核心价值：**不出国籍体系即可获得国际身份**、低税制（利得税首HK$200万利润8.25%、超出部分16.5%；薪俸税最高15%）、国际金融中心便利、171国免签特区护照、子女DSE+华侨生联考双教育路径、大湾区港人税收优惠（个税超15%财政返还）。\n\n本方案执行重点：第一，精准匹配入境计划通道；第二，CIES资金合规投资+持续满足门槛；第三，7年通常居住从第一天开始布局，确保永居申请成功。\n\n## 一、客户家庭基本信息（待补充版）\n\n### 1.1 已知/默认信息\n\n| 项目 | 当前信息 | 状态 |\n|---|---|---|\n| 客户身份 | 中国内地家庭/企业主/高净值客户 | ⚠️ 待确认 |\n| 核心目标 | 香港居民身份→7年永居、子女教育、资产配置、税务优化 | ⚠️ 待确认 |\n| 预算范围 | CIES需≥HK$3,000万可投资资产；TTPS-A需年收入≥HK$250万 | ✅ 已知政策门槛 |\n| 家庭成员 | 主申请人、配偶、18岁以下子女可随行 | ⚠️ 待确认家庭结构 |\n| 是否计划在港居住 | 7年通常居住是永居前提，需从第一年起布局 | ⚠️ 待确认 |\n| 子女教育需求 | 香港本地学校/国际学校/DSE/华侨生联考 | ⚠️ 待确认 |\n| 资金来源 | 投资款或收入证明需合规可追溯 | ❌ 待确认 |\n| 税务居民身份 | 当前为中国税务居民 | ⚠️ 需评估香港税务居民切换 |\n| 现有境外资产 | 是否有香港/境外银行账户或资产 | ❌ 待确认 |\n| 是否有外国永久居民身份 | CIES要求中国籍申请人须先取得外国永居 | ⚠️ CIES资格前提 |\n\n### 1.2 待解决问题分级\n\n| 编号 | 问题 | 严重度 | 说明 |\n|---|---|---|---|\n| Q1 | 入境计划通道匹配 | P0 | CIES、TTPS-A/B/C、QMAS、ASMTP、IANG各有不同适用条件，选错通道可能导致申请被拒 |\n| Q2 | CIES资格前提（外国永居） | P0 | 纯中国内地居民须先取得第三国永居；如客户无外国永居，CIES不可行 |\n| Q3 | 7年通常居住规划 | P0 | 永居要求"连续通常居住不少于7年"，不能仅靠偶尔入境糊弄 |\n| Q4 | 资金合规出境 | P0 | CIES需HK$3,000万+合规投资，大额资金出境必须走合规通道 |\n| Q5 | 子女年龄窗口 | P1 | 18岁以下方可随行；如子女接近18岁，需加速办理 |\n| Q6 | TTPS/QMAS续签条件 | P1 | TTPS续签须在港受雇或开办业务；QMAS续签须证明已定居 |\n| Q7 | 华侨生联考不可逆选择 | P2 | 需注销内地户口方可以港澳侨身份报考，影响深远 |\n| Q8 | 香港税务居民切换 | P2 | 183天居住分布规划，避免内地+香港双重税务居民风险 |\n| Q9 | 配偶工作权利 | P2 | 受养人签证通常可工作，但以入境处批准为准 |\n| Q10 | 香港生活成本 | P3 | 全球生活成本最高城市之一，需充足预算 |\n\n### 1.3 根本判断\n\n**表面问题**：客户想办一个香港身份。\n\n**真实问题**：客户需要一个不出国籍体系、文化语言零障碍、低税制、国际金融中心、子女教育多元路径（DSE+华侨生联考+海外升学）的身份工具，同时保持与内地的紧密商业和家庭联系。核心矛盾在于：7年通常居住要求与客户可能不希望长期在香港生活之间的矛盾。\n\n---\n\n## 二、核心策略\n\n### 2.1 三分离定位\n\n| 维度 | 香港方案中的定位 | 判断 |\n|---|---|---|\n| 事业国 | 中国内地/香港双总部 | 香港可作为国际业务总部、区域管理中心或上市平台 |\n| 居住国 | 内地+香港双栖 | 7年通常居住需在香港有实质生活痕迹；配偶+子女在港可大幅降低主申请人居住压力 |\n| 福利国 | 香港公共医疗/15年免费教育 | 公立医疗高质量（住院HK$120/天封顶）、国际学校选择多 |\n| 管钱地 | 香港国际金融中心 | 无外汇管制、资金自由流动、成熟家办/私银生态 |\n| 功能性身份 | 香港永居+特区护照 | 171国免签、大湾区红利、华侨生联考、内地港人税优 |\n\n### 2.2 六大路径选择矩阵\n\n| 路径 | 适合人群 | 核心条件 | 审批速度 | 首次签证 | 续签难度 | 推荐优先级 |\n|---|---|---|---|---|---|---|\n| CIES | 企业主/高净值（有外国永居） | HK$3,000万净资产+投资 | 6-8月 | 2年 | ★★☆ | ★★★★★ |\n| TTPS-A | 企业主/高管（年收入≥HK$250万） | 年收入达标 | 4周 | 36月 | ★★★ | ★★★★★ |\n| TTPS-B | 百强本科+3年经验 | 学历+经验 | 4周 | 24月 | ★★★ | ★★★★ |\n| QMAS | 综合条件优秀 | 12条≥6条 | 6-9月 | 3年 | ★★★★ | ★★★ |\n| ASMTP自雇 | 在港创业者 | 实体经营 | 1-3月 | 36月 | ★★☆ | ★★★ |\n| ASMTP雇主 | 已获港雇主offer | 雇主担保 | 1-3月 | 36月 | ★☆☆ | ★★ |\n\n### 2.3 推荐核心路线\n\n**推荐方案A：CIES资本投资者入境计划 — 高净值企业主首选。**\n\n理由：\n1. **无学历/语言/年龄/工作经验要求**：仅需净资产≥HK$3,000万，持有≥2年。\n2. **续签条件最宽松**：只需维持投资+通常居住，不需证明在港受雇或经营。\n3. **投资灵活**：可配置股票、债券、基金、存款证、非住宅房产等获许资产。\n4. **全家同行**：配偶及18岁以下未婚子女同步获批。\n5. **7年转永居**：完成通常居住要求+维持投资后申请。\n6. **⚠️ 资格前提**：中国内地居民须先取得第三国永久居民身份（这是CIES对"中国籍"申请人的硬性要求），可考虑通过瓦努阿图/格林纳达等低成本永居方案先行取得永居资格。\n\n**推荐方案B：TTPS高才通A类 — 高收入企业主/高管。**\n\n理由：\n1. **审批极快**：4周内完成，速度是最大优势。\n2. **无学历硬性要求**：A类只看收入（紧接申请前12个月≥HK$250万）。\n3. **首次获36个月**（2024.11起从24个月延长至36个月）。\n4. **在港可自由工作/创业**：无雇主绑定。\n5. **⚠️ 续签须在港受雇或经营**：第3年续签时须已在港就业（薪酬达市场水平）或已开办业务。\n\n**推荐方案C：TTPS高才通B类 — 百强本科+经验。**\n\n理由：合资格大学已扩至198所（2024年11月），审批约4周，适合名校毕业且有≥3年工作经验的申请人。\n\n**推荐方案D：优才QMAS — 兜底方案。**\n\n新综合计分制12条评估准则，需满足≥6条（年龄、学历、语言、工作经验、年收入≥HK$100万、业务所有权等），审批6-9月。\n\n---\n\n## 三、合规清理详细方案\n\n### 3.1 资金来源合规\n\n香港入境处对所有入境计划均进行资金来源审查，CIES审查尤为严格：\n\n| 环节 | 合规要求 | 风险点 | 执行动作 |\n|---|---|---|---|\n| 净资产证明（CIES） | 申请前2年内持续拥有≥HK$3,000万净资产 | 代持资产、临时拆借、虚假估值 | 准备2年银行对账单、房产评估报告、股票持仓证明、审计报告 |\n| 收入证明（TTPS-A） | 紧接申请前12个月年收入≥HK$250万 | 现金收入无凭证、灰色收入 | 完税证明+银行流水+雇主证明信/公司分红决议 |\n| 学历证明（TTPS-B） | 学士及以上学位+百强大学名单 | 非全日制/海外学位认证问题 | 学位证书+成绩单+教育部认证报告 |\n| 资金来源解释 | 能清晰说明资产/收入合法来源 | 企业未纳税利润、代持资产 | 纳税记录+企业审计报告+分红决议+股权转让协议 |\n| 资金出境 | 从合规渠道将资金转入香港 | 地下钱庄、虚假贸易 | ODI/境外存量/合规换汇 |\n| 香港银行KYC | 开立投资/私人银行账户 | 资金来源不清、高风险行业 | 提前准备资金来源说明文件包 |\n| 持续投资合规（CIES） | 维持投资≥HK$3,000万7年 | 市值波动跌破门槛 | 建立投资监控+补仓机制 |\n| 每年报告（CIES） | 向投资推广署提交年度投资组合报告 | 漏报/迟报可能影响身份 | 委托会计师/顾问定期出具 |\n\n\n\n### 3.1.1 企业KYB（Know Your Business）审查\n\n如果客户资金来源于企业分红/股权转让/利润分配，除个人KYC外还需对企业进行KYB审查：\n\n| 审查项目 | 所需材料 | 用途 |\n|---|---|---|\n| 企业基本信息 | 营业执照正副本、工商登记信息 | 确认企业合法存续 |\n| 财务状况 | 近3年审计报告/财务报表 | 验证盈利能力、留存收益 |\n| 股权结构 | 企业股权架构图（穿透至最终受益人） | 确认实际控制人 |\n| 纳税合规 | 近3年纳税记录/完税证明 | 验证合法纳税、无逃税 |\n| 公司治理 | 股东会/董事会决议（分红决议、股权转让决议） | 确认资金流出合规性 |\n| 经营实质 | 实际经营地、员工人数、主营业务说明 | 排除空壳公司 |\n| 关联交易 | 关联方及关联交易说明（如有） | 转让定价合规 |\n| 合规记录 | 无重大违法违规证明 | 排除违法经营 |\n\n> ⚠️ 注意：香港入境处和金管局(HKMA)对CIES大额投资的资金来源审查会穿透看企业是否合法经营、是否足额纳税、分红是否有足够留存收益支撑。如资金来源为\"企业未分配利润分红\"，须确保企业审计报告中的留存收益≥分红金额。\n
### 3.2 CIES资格前提：中国籍+外国永居\n\nCIES申请人资格有一项关键条件：\n- 外国国民（非中国籍）；或\n- 澳门居民/台湾居民；或\n- **中国籍但已取得外国永久居民身份者**\n\n这意味着纯中国内地居民（无任何外国永居）原则上不能申请CIES。客户需先通过以下方式取得第三国永居资格：\n\n| 方案 | 成本 | 时间 | 说明 |\n|---|---|---|---|\n| 瓦努阿图永居 | 约USD 10,000-15,000 | 1-2周 | 最低成本、最快速度 |\n| 格林纳达永居 | 约USD 150,000 | 3-4月 | 同时可获E-2资格 |\n| 希腊黄金签证 | 约€250,000+ | 3-6月 | 申根区永居附加值 |\n| 马耳他MPRP | 总计约€150,000-200,000 | 12-18月 | 申根区永居，但周期长 |\n\n### 3.3 中国国籍与户籍\n\n香港是中国特别行政区，身份规划不涉及国籍变更：\n- 取得香港居民身份证 → 7年通常居住 → 香港永久居民身份证。\n- 香港永居可申请香港特区护照（须为中国公民）。\n- 华侨生联考需香港永居+回乡证，而回乡证办理需注销内地户口——**不可逆决定**。\n- 大湾区港人税优需实际在港受雇/经营。\n\n### 3.4 反洗钱与银行KYC\n\n香港金管局(HKMA)对银行KYC/AML要求严格，比内地银行更注重实质审查：\n- 主申请人护照、身份证、户口本、婚姻证明\n- 无犯罪记录证明（近12个月内）\n- 收入证明、完税证明（近3年）\n- 企业营业执照、审计报表、股权架构图\n- 投资资金来源说明及资金路径图\n- CIES额外要求：香港执业会计师签署的净资产报告\n\n---\n\n## 四、境外资金归集与投资架构\n\n### 4.1 推荐资金路径\n\n| 路径 | 适用客户 | 优点 | 缺点 | 适合金额 |\n|---|---|---|---|---|\n| 香港已有资产 | 已有香港账户/资产 | 效率最高、合规最强 | 需解释历史来源 | HK$500万+ |\n| ODI商业投资 | 有境内实体企业 | 合规性强、金额大 | 审批2-4个月、材料复杂 | HK$1,000万+ |\n| 境外分红/股东借款 | 已有境外架构 | 税务筹划灵活 | 需转让定价文档 | HK$500万+ |\n| 境外上市股权变现 | 上市企业主 | 金额大、来源清晰 | 需符合外汇管理要求 | HK$3,000万+ |\n| 家族合规购汇 | 个人5万美元/年×成员 | 最简单 | 额度极有限 | HK$100万以下 |\n| 地下钱庄 | — | 表面快 | P0红区，极高风险 | — |\n\n### 4.2 CIES资金预算框架\n\n| 项目 | 预算口径 | 说明 |\n|---|---:|---|\n| 获许金融资产投资 | HK$30,000,000 | CIES核心投资，7年维持 |\n| 强制创科投资组合 | HK$3,000,000 | 含在HK$3,000万内 |\n| 申请费 | HK$5,000 | 入境处申请费 |\n| 签证费 | HK$6,000起 | 获批后缴纳 |\n| 会计师净资产报告 | HK$30,000-50,000 | 香港执业会计师签署 |\n| 律师/顾问服务费 | 按合同报价 | 委托持牌移民顾问 |\n| 银行开户/管理费 | HK$0-50,000/年 | 视银行层级 |\n| 投资管理费 | 年约0.5%-1.5% | 基金/债券管理费 |\n| 国内公证/翻译 | RMB 3,000-8,000 | 按材料数量 |\n| 家庭成员签证 | HK$6,000/人 | 配偶及子女 |\n| 香港租房 | HK$25,000-60,000/月（港岛/九龙） | 通常居住地址 |\n| 子女国际学校 | HK$10-30万/年·子女 | 按学校 |\n\n### 4.3 TTPS路径资金预算框架\n\n| 项目 | 预算口径 | 说明 |\n|---|---:|---|\n| TTPS网上申请费 | HK$250 | 入境处收 |\n| 签证费 | HK$6,000/人 | 获批后缴纳 |\n| 公证/翻译 | RMB 2,000-5,000 | 学历证明等 |\n| 律师/顾问服务费 | 按合同报价 | 非必须但建议 |\n| 香港租房押金+首年 | HK$300,000-720,000 | 通常居住地址 |\n| 子女国际学校首年 | HK$10-30万×子女人数 | 按学校 |\n\n---\n\n## 五、投资使用建议\n\n### 5.1 CIES获许金融资产完整清单（2024年3月版）\n\n| 类别 | 具体内容 | 限制 |\n|---|---|---|\n| 1. 港交所上市股票 | 以港元交易的香港上市公司股票 | 不限 |\n| 2. 港元债券 | 港府、外汇基金、按揭证券公司、机管局、港铁等发行或AAA评级的港元债券 | 不限 |\n| 3. 存款证 | 由《银行业条例》认可的机构发行、港元计价 | 到期日不超过12个月 |\n| 4. 后偿债项 | 认可机构发行的后偿债项，港元计价 | 不限 |\n| 5. 合资格集体投资计划 | SFC认可的基金（含ETF，含货币市场基金） | 不限 |\n| 6. 有限合伙基金 | 在港注册的LPF，拥有权权益 | 不限 |\n| 7. 非住宅房地产 | 写字楼、商铺、工业楼宇、停车场（不含住宅） | 最多HK$1,000万（占总投资上限） |\n| 8. 创新科技投资组合 | 港府指定——香港投资管理有限公司 | 强制配置HK$300万 |\n| 9. 保险公司投连险 | SFC认可 | 不限 |\n\n### 5.2 推荐CIES投资组合配置\n\n| 资产类别 | 建议配置额 | 占比 | 特点 |\n|---|---:|---|---|\n| 恒指成份股/蓝筹 | HK$6,000,000 | 20% | 流动性好、派息稳定 |\n| 港元投资级债券 | HK$7,500,000 | 25% | 稳健收息、资本保值 |\n| SFC认可基金/ETF | HK$7,500,000 | 25% | 分散风险、专业管理 |\n| 存款证 | HK$3,000,000 | 10% | 类现金、极低波动 |\n| 非住宅房地产 | HK$3,000,000 | 10% | 写字楼/商铺 |\n| 创新科技投资组合 | HK$3,000,000 | 10% | 强制配置 |\n| **合计** | **HK$30,000,000** | **100%** | |\n\n### 5.3 投资管理重点\n\n| 原则 | 说明 |\n|---|---|\n| 市值监控 | 投资组合总市值不得低于HK$3,000万，低于门槛时须在合理期限内补足 |\n| 年度报告 | 每周年须向投资推广署提交由执业会计师签署的投资组合报告 |\n| 资产转换 | CIES允许在获许资产类别间转换，但转换后须仍全部为获许资产，且应及时报告 |\n| 非住宅房产上限 | 非住宅房地产总值不得超过HK$1,000万 |\n| 不得质押 | 投资资产不得用于抵押或质押贷款 |\n| 提取收益 | 股息、利息、租金等收益可自由提取（不属撤资） |\n| 7年锁定期 | 投资须维持7年；7年内在港通常居住满7年+投资维持，方可申请永居 |\n\n### 5.4 不建议做法\n\n- 不建议全部资金集中单一股票或低流动性资产\n- 不建议忽视市值波动导致跌破HK$3,000万门槛风险\n- 不建议用投资款项加杠杆或衍生品投机\n- 不建议购买住宅房产（住宅不在CIES获许资产清单内）\n- 不建议投资非SFC认可/非港交所上市产品\n- 不建议将创新科技投资组合视为可选项目（强制HK$300万，不可规避）\n- 不建议只听单一销售方推荐，应由独立投资顾问+会计师+律师三方确认\n\n---\n\n## 六、财富架构搭建方案\n\n### 6.1 推荐架构：香港为财富管理中心\n\n\`\`\`text\n中国境内运营实体/家庭资产\n        ↓ 合规资金路径（ODI/分红/境外存量）\n香港控股公司/家族办公室\n        ↓\n┌─────────────────────────────┐\n│  CIES投资组合（HK$3,000万）  │\n│  股票/债券/基金/存款证/房产  │\n└─────────────────────────────┘\n        ↓\n香港私人银行账户（全球资产配置）\n        ↓\n┌─────────────────────────────┐\n│ 可选延伸层                    │\n│ · 海外信托（传承规划）        │\n│ · 新加坡/迪拜控股（多中心）   │\n│ · 境外上市公司持股平台        │\n└─────────────────────────────┘\n\`\`\`\n\n### 6.2 香港家族办公室税务宽免\n\n2023年5月，香港立法会通过《2023年税务（修订）（家族投资控权工具的税务宽减）条例》：\n\n| 维度 | 详情 |\n|---|---|\n| 合资格实体 | 家族投资控股实体(FIHV)，通常以公司/合伙/信托形式 |\n| 管理资产门槛 | ≥HK$2.4亿 |\n| 税务宽免 | 合资格交易利润0%利得税 |\n| 管理要求 | 须由单一家族办公室(SFO)在香港管理 |\n| 雇员要求 | SFO须在香港雇用≥2名全职合资格雇员，年度营运开支≥HK$200万 |\n| 与CIES协同 | CIES解决身份需要，SFO解决财富管理+传承+税务需要，两者互补 |\n\n### 6.3 大湾区跨境架构\n\n| 场景 | 架构建议 | 税务/合规考量 |\n|---|---|---|\n| 内地企业香港上市 | 开曼/BVI上市主体 → 香港控股 → WFOE → VIE/直接持股境内 | 需内地律师+香港律师+上市保荐人协同 |\n| 内地→香港利润回流 | 内地运营公司 → 分红 → 香港控股公司 | 预提所得税5%（符合税收协定条件） |\n| 香港→内地投资 | 香港公司 → 外商独资企业(WFOE) → 内地运营 | 外商投资负面清单审查 |\n| 跨境服务贸易 | 香港公司 → 服务合同 → 内地客户 | 增值税、常设机构风险 |\n\n### 6.4 不建议架构\n\n- 不建议为税务目的将内地全部利润虚构转移至香港\n- 不建议用香港公司做纯"开票"通道而无实际功能/人员/资产\n- 不建议在港购买住宅房产作为CIES投资\n- 不建议忽视内地CFC受控外国企业规则\n- 不建议架构过于复杂导致CRS申报风险提升\n\n---\n\n## 七、税务分析\n\n### 7.1 香港税制核心\n\n| 税种 | 税率 | 说明 |\n|---|---|---|\n| 利得税 | 首HK$200万利润→8.25%；超出→16.5% | 地域来源原则（仅对源自香港的利润征税） |\n| 薪俸税 | 累进2%-17%（标准税率15%，取低者） | 仅对香港来源雇佣收入征税 |\n| 物业税 | 15% | 出租物业收入，可扣减差饷+20%修葺津贴 |\n| 印花税 | 股票0.13%；住宅（撤辣后）最高4.25% | 2024年撤辣后非永居购房额外印花税已取消 |\n| 资本利得税 | 无 | 香港不征资本利得税 |\n| 增值税/GST | 无 | 香港不设增值税 |\n| 股息税 | 无 | 香港公司派息免税 |\n| 利息税 | 无 | 银行存款利息免税 |\n| 遗产税 | 无 | 2006年2月11日废除 |\n\n### 7.2 税务居民判断\n\n| 情形 | 税务身份判断 | 影响 |\n|---|---|---|\n| 仅持居民身份，不在港常居 | 通常不自动成为香港税务居民，仍为中国税务居民 | 中国全球征税 |\n| 在港居住≥183天/年 | 可能构成香港税务居民，但香港仅按地域来源征税 | 实际税负可能更低 |\n| 内地+香港双栖 | 需以税收协定"加比规则"打破双重居民僵局 | 看永久住所→重要利益中心→习惯性居所→国籍 |\n| 通过香港公司经营跨境业务 | 香港公司仅就香港来源利润纳税 | 注意内地CFC规则和转让定价 |\n\n### 7.3 香港税制核心优势\n\n| 优势 | 说明 | 对高净值客户价值 |\n|---|---|---|\n| 地域来源原则 | 境外利润不在港征税 | 内地企业经香港出口，在港部分利润仅8.25%-16.5% |\n| 无资本利得税 | 出售股票/资产收益免税 | 资产配置和退出零税负 |\n| 无股息税 | 香港公司派息不征税 | 财富提取灵活 |\n| 无遗产税 | 财富传承零税负 | 适合家族财富传承 |\n| 无增值税 | 商品服务不征流转税 | 生活成本更低 |\n| 大湾区税优 | 合资格港人在大湾区九市个税超15%返还 | 在港受雇+住大湾区=极低实际税负 |\n\n### 7.4 税务风险边界\n\n- 取得香港居民身份 ≠ 自动成为香港税务居民\n- 内地CFC规则：香港受控外国企业的未分配利润可能被视为内地居民企业的当期收入\n- 转让定价：内地与香港关联交易的定价需符合独立交易原则\n- CRS：香港金融机构向内地交换金融账户信息\n- 大湾区税优：需实际在港受雇并缴纳薪俸税，非仅持身份即可\n- 183天规则：在香港居住≥183天/年在香港税务判定中重要，在中国税务居民判定中也重要\n\n---\n\n## 八、资金跨境合规方案\n\n### 8.1 CIES资金出境推荐路径\n\n| 阶段 | 动作 | 周期 | 交付物 |\n|---|---|---|---|\n| 1 | 客户资产全面体检：银行存款、股票、房产、企业股权、信托 | 1-2周 | 资产清单+来源路径图 |\n| 2 | 确认出境方式：ODI/境外存量/上市股权变现/合规换汇 | 2-4周 | 资金出境方案确认书 |\n| 3 | ODI路径：发改委备案+商务部核准+外汇登记 | 4-8周 | ODI全套批文 |\n| 4 | 境外存量：提供历史资金来源证明 | 1-2周 | 资金来源说明书 |\n| 5 | 开立香港银行账户（CIES需指定投资账户） | 1-4周 | 银行开户确认 |\n| 6 | 资金转入香港并留存完整银行记录 | 1-4周 | 汇款凭证链 |\n| 7 | 聘请香港会计师出具净资产审计报告 | 2-4周 | 审计报告 |\n| 8 | 提交CIES申请 | 1周 | 申请回执 |\n\n### 8.2 ODI路径详解\n\n| 步骤 | 部门 | 文件 | 周期 |\n|---|---|---|---|\n| 1.发改委备案/核准 | 国家/省发改委 | 境外投资项目备案表/申请书 | 7-20工作日 |\n| 2.商务部备案/核准 | 商务部/省商务厅 | 境外投资备案表/申请表 | 3-7工作日 |\n| 3.外汇登记 | 银行/外管局 | ODI外汇登记 | 1-2周 |\n| 4.资金汇出 | 银行 | 外汇汇出申请 | 1-5工作日 |\n| 合计 | | | 约1-3个月 |\n\nODI适合金额大（HK$3,000万级别）、合规性要求最高的CIES路径。但ODI要求境外投资有真实项目，做CIES投资组合能否通过ODI审批需个案判断——建议以"在香港设立投资控股平台+投资香港金融市场"为名义申报。\n\n\n\n### 8.2.1 个人境外投资合规——37号文登记\n\n37号文全称《国家外汇管理局关于境内居民通过特殊目的公司境外投融资及返程投资外汇管理有关问题的通知》（汇发〔2014〕37号），是境内居民个人境外投资最重要的合规路径之一。\n\n**适用对象：**\n- 境内居民个人以境外特殊目的公司(SPV)进行境外投融资及返程投资\n- 常见场景：个人在境外设立BVI/开曼/香港公司接收境内资产\n\n**核心要求：**\n- 需在设立/控制SPV后、向SPV出资前办理外汇登记\n- 登记机关：国家外汇管理局（通过银行办理）\n- 须提供：SPV注册文件、境内居民身份证明、境外融资商业计划书等\n\n**未办理37号文登记的后果：**\n- 无法合规将境内资产注入境外SPV\n- 返程投资（WFOE/FDI）时外汇无法合规入境\n- 可能被认定为逃汇，面临行政处罚甚至刑事责任\n- 境外上市时构成重大合规障碍\n\n**37号文与ODI的关系：**\n- ODI覆盖企业层面对外投资（适合境内公司直接对外投资）\n- 37号文覆盖个人层面境外持股（适合个人通过SPV持有境外资产）\n- 两者可以互补使用：ODI做企业投资通道，37号文做个人持股合规\n\n**操作要点：**\n- 37号文登记须在\"出资前\"完成（先登记后出资），不可事后补办\n- 登记须在SPV设立/控制后尽快办理（建议在SPV设立后30日内启动）\n- 实际办理周期：通常1-3个月（取决于当地外管局和银行审核速度）\n- 建议在资金出境方案设计阶段同步评估37号文适用性\n- 如需跨境架构，应在签约前由律师确认37号文可行性\n
### 8.3 严禁路径\n\n- 地下钱庄/找换店大额换汇\n- 虚假贸易/虚开发票\n- 现金搬运出入境\n- 第三方代付且无法解释最终受益人\n- 多人拆分5万美元购汇后归集至同一香港账户\n- 虚拟货币换汇（政策灰色地带，风险极大）\n\n---\n\n## 九、身份路径规划\n\n### 9.1 香港身份路径全景\n\n| 路径 | 适用人群 | 首次获批 | 续签模式 | 转永居 | 配偶工作 |\n|---|---|---|---|---|---|\n| CIES | 高净值（≥HK$3,000万+外国永居） | 2年 | 3+3年 | 7年 | ✅ 可 |\n| TTPS A类 | 年收入≥HK$250万 | 3年(2024.11起) | 3+3年 | 7年 | ✅ 可 |\n| TTPS B类 | 百强本科+≥3年经验 | 2年 | 3+3年 | 7年 | ✅ 可 |\n| TTPS C类 | 百强本科+<3年经验（限额10,000/年） | 2年 | 3+3年 | 7年 | ✅ 可 |\n| QMAS | 12条≥6条 | 3年 | 3+2年 | 7年 | ✅ 可 |\n| ASMTP | 获香港雇主聘用/自雇 | 3年(通常) | 3+2年 | 7年 | ✅ 可 |\n| IANG | 港校/大湾区校园毕业生 | 2年 | 3+3年 | 7年 | ✅ 可 |\n\n### 9.2 CIES资本投资者入境计划——深度解析\n\n| 维度 | 内容 |\n|---|---|\n| **法律依据** | 《入境条例》第115章；CIES计划规则（2024年3月1日起生效） |\n| **推出/重启** | 首次2003年推出、2015年暂停、2024年3月1日正式重启 |\n| **申请人资格** | 年满18岁；外国国民/中国籍但已取得外国永居/澳门居民/台湾居民 |\n| **净资产** | 申请前2年持续拥有≥HK$3,000万净资产（全球任何资产均可） |\n| **投资金额** | 原则批准后6个月内完成≥HK$3,000万获许金融资产投资 |\n| **强制创科** | HK$300万必须投资至"创新科技投资组合" |\n| **非住宅上限** | 非住宅房地产投资不超过HK$1,000万 |\n| **审批机关** | 新资本投资者入境计划办公室（投资推广署+入境处联合） |\n| **审批时间** | 约6-8个月（以入境处及投资推广署实际处理进度为准） |\n| **首次签证** | 2年 |\n| **续签** | 3年+3年 |\n| **永居** | 在港通常居住连续≥7年 → 申请永居 |\n| **无条件逗留** | 7年后如不满足居住要求可申请无条件逗留（需维持投资） |\n| **投资撤出** | 7年后可自由处置投资（永居获批后）；如获无条件逗留也可撤资 |\n| **随行成员** | 配偶+18岁以下未婚子女 |\n| **可否工作** | ✅ 可在港就业或经营业务 |\n\n### 9.3 CIES vs QMAS 关键差异\n\n| 维度 | CIES | QMAS |\n|---|---|---|\n| 核心门槛 | 资产≥HK$3,000万+投资 | 12条准则≥6条 |\n| 学历要求 | 无 | 通常需本科以上 |\n| 语言要求 | 无 | 中英文能力 |\n| 年龄 | 18岁以上 | 18-50岁优 |\n| 续签条件 | 维持投资 | 证明已定居+有贡献 |\n| 续签难度 | ★★☆ | ★★★★ |\n| 审批速度 | 6-8月 | 6-9月 |\n| 适合人群 | 高净值企业主 | 高学历+高收入+语言好的专业人士 |\n\n### 9.4 TTPS高才通A类——深度解析\n\n| 维度 | 内容 |\n|---|---|\n| **推出时间** | 2022年12月28日 |\n| **核心条件** | 紧接申请前12个月全年收入≥HK$250万（约RMB 230万） |\n| **收入口径** | 薪金+津贴+花红+股票期权+公司分红（须完税） |\n| **学历要求** | 无 |\n| **工作经验** | 无硬性要求 |\n| **审批速度** | 约4周 |\n| **首次签证** | 2024年11月起→36个月（此前为24个月） |\n| **续签条件** | 须已在港受雇（薪酬达市场水平）或已开办/参与业务 |\n| **续签难度** | ★★★（需在港有实际工作/经营） |\n| **配偶** | 可在港工作 |\n| **优点** | 审批最快、不看学历、首次直接给3年 |\n| **缺点** | 续签须证明在港受雇/经营，非"办完就不管" |\n\n### 9.5 TTPS高才通B类——深度解析\n\n| 维度 | 内容 |\n|---|---|\n| **核心条件** | ①获合资格大学颁授学士学位 ②紧接申请前5年内累积≥3年工作经验 |\n| **合资格大学** | 2024年11月更新为198所（含内地23所：清华、北大、复旦、浙大、上交、南大、中科大、中山、华科、武大、西安交大、哈工大、中南、东南、北航、北理、同济、南开、天津、川大、厦大、人大、华师） |\n| **审批速度** | 约4周 |\n| **首次签证** | 2年 |\n| **续签** | 3+3年 |\n| **续签条件** | 须在港受雇/经营 |\n\n### 9.6 优才QMAS——深度解析\n\n新综合计分制（12条准则，须≥6条）：\n\n| 准则 | 内容 |\n|---|---|\n| 1.年龄 | 18-50岁 |\n| 2.学历 | 硕士/博士学位（STEM/指定领域优先） |\n| 3.语言—中文 | 良好中文书写及口语能力 |\n| 4.语言—英文 | 良好英文书写及口语能力（IELTS≥6.5或认可英文授课学历） |\n| 5.工作经验年限 | ≥5年学位级别工作经验 |\n| 6.工作经验—管理 | ≥3年管理级别工作经验 |\n| 7.工作经验—跨国/名企 | ≥2年跨国企业或知名企业工作经验 |\n| 8.国际工作经验 | ≥2年海外工作经验 |\n| 9.年收入 | 紧接申请前12个月≥HK$100万 |\n| 10.业务所有权—营利 | 持有盈利企业≥50%股权 |\n| 11.业务所有权—上市 | 持有上市公司≥10%股权 |\n| 12.业务所有权—创新 | 持有创新/科技企业股权 |\n\n### 9.7 专才ASMTP自雇——深度解析\n\n| 维度 | 内容 |\n|---|---|\n| **适用** | 在香港注册公司并真实经营的企业主 |\n| **公司要求** | 实体办公室、香港雇员、真实业务流水、审计报告 |\n| **商业计划书** | 需详细说明业务模式、市场分析、财务预测、对港经济贡献 |\n| **审批重点** | 商业可行性、无法由本地人替代、对香港的经济贡献 |\n| **首次签证** | 通常36个月 |\n| **续签** | 3+2年 |\n| **优点** | 自己控制续签节奏；续签看经营情况，不一定比TTPS难 |\n| **缺点** | 需要在港真实创业、雇佣、运营；非壳公司 |\n\n---\n\n## 十、教育规划\n\n### 10.1 香港教育体系\n\n| 阶段 | 年数 | 公立 | 国际学校 |\n|---|---|---|---|\n| 幼稚园 | 3年(K1-K3) | 学券计划资助（约HK$1,500-3,000/月） | HK$8-25万/年 |\n| 小学 | 6年(P1-P6) | 免费（15年义务教育） | HK$12-25万/年 |\n| 中学 | 6年(S1-S6) | 免费→DSE考试 | HK$15-28万/年 |\n| 大学 | 4年 | HK$42,100/年（本地生） | 海外升学衔接 |\n\n### 10.2 三大教育路径详解\n\n#### 路径一：DSE文凭考试（香港学生核心路径）\n\n| 优势 | 具体内容 |\n|---|---|\n| 香港八大 | 港大、中大、科大、理大、城大、浸大、岭大、教大，本地生学费HK$42,100/年 |\n| 内地138所高校 | 凭DSE成绩免试招生（含清华、北大、复旦、浙大等），录取线远低于高考 |\n| 海外大学 | DSE获英、澳、加、新加坡等广泛认可 |\n| 考试特点 | 中文作答（除英文科）、4核心+2-3选修、无文理分科 |\n\n#### 路径二：华侨生联考\n\n| 项目 | 内容 |\n|---|---|\n| 资格前提 | 香港永久居民身份 + 回乡证（需注销内地户口） |\n| ⚠️ 核心代价 | 注销内地户口——不可逆决定，影响社保、宅基地、户籍权益 |\n| 录取优势 | 低分录取211/985/双一流（通常低于高考100-200分） |\n| 考试科目 | 文史类（语数英+史地）或理工类（语数英+物化） |\n| 报名人数 | 约5,000-7,000人/年（远低于高考1,300万人） |\n| 适合人群 | 明确子女未来规划在内地高校，且愿意放弃内地户籍 |\n\n#### 路径三：国际学校+海外升学\n\n| 学校类型 | 年费（HK$） | IB平均分 | 代表学校 |\n|---|---|---|---|\n| 英基(ESF) | HK$12-17万 | 36+ | 英皇佐治五世、沙田学院等 |\n| 国际学校 | HK$15-28万 | 36-41 | CIS汉基、GSIS德瑞、HKIS香港国际、CDNIS加拿大国际 |\n| 直资学校 | HK$2-8万 | 33-37 | 拔萃女书院、圣保罗男女、男拔萃 |\n\n### 10.3 教育路径决策矩阵\n\n| 子女年龄 | 推荐路径 | 需要的时间窗口 |\n|---|---|---|\n| 0-5岁 | 任何路径均可 | 充裕 |\n| 6-10岁 | DSE最佳窗口期（完成完整中小学） | 小学阶段 |\n| 11-14岁 | 需加速决定路径（DSE vs 华侨生联考 vs 国际学校） | 中学关键期 |\n| 15-17岁 | 配合路径加速（恐来不及完整DSE备考） | 紧迫 |\n| ≥18岁 | 不能作为受养人随行 | 须独立申请 |\n\n### 10.4 关键提醒\n\n- **华侨生联考 = 注销内地户口**：以港澳身份报考的前提是香港永居+回乡证，回乡证需注销内地户籍。\n- **DSE免试招生不需注销户籍**：香港DSE考生凭成绩直接申请内地高校，保持内地户籍。\n- **子女18岁红线**：获批时须未满18岁，审核以入境处收到完整申请材料之日为准。如子女接近18岁，建议加急处理。\n- **国际学校学位紧张**：香港优质国际学校通常需提前1-2年排队，部分需购买债券。\n\n---\n\n## 十一、福利居住国规划\n\n### 11.1 香港医疗体系\n\n| 服务机构 | 住院 | 专科门诊 | 急症 | 特点 |\n|---|---|---|---|---|\n| 医管局公立医院 | HK$120/天（全包） | HK$135（首次）/ HK$80（复诊） | HK$180 | 排队时间长、非紧急手术轮候数月-数年 |\n| 私立医院 | HK$800-5,000+/天 | HK$500-2,000 | HK$800-3,000 | 无需等候、服务好 |\n\n客户建议：购买国际医疗保险（年保费HK$1-3万），私院就诊+公院大病保障。\n\n### 11.2 香港居住成本（2026年参考）\n\n| 项目 | 港岛/九龙 | 新界 |\n|---|---|---|\n| 两房月租 | HK$30,000-60,000 | HK$15,000-30,000 |\n| 三房月租 | HK$50,000-100,000 | HK$25,000-50,000 |\n| 住宅售价 | HK$15,000-30,000/尺 | HK$8,000-15,000/尺 |\n| 物业管理费 | HK$2,000-8,000/月 | HK$1,500-4,000/月 |\n| 水电煤 | HK$1,500-3,500/月 | HK$1,000-2,500/月 |\n| 外佣工资 | HK$4,990/月（最低工资） | 同 |\n\n### 11.3 7年通常居住——永居核心策略\n\n"通常居住"是入境处综合考量的标准，不仅是居住天数：\n\n| 考量因素 | 客户应做的布局 |\n|---|---|\n| 在港惯常住所 | 签订长期租约或购买住宅（以配偶/子女名义常住） |\n| 家庭成员在港 | 配偶+子女在港常住=最强居住证据 |\n| 在港工作/经营 | 香港雇主聘约/公司注册+审计报告+纳税记录 |\n| 不在港原因 | 如主申经常离港，需有合理说明（内地业务/照顾老人等） |\n| 在港联系 | 银行账户、会员卡、驾驶证、水电账单、电话账单 |\n| 香港纳税 | 每年在港有薪俸税/利得税申报记录 |\n\n**推荐策略**：\n- 策略一（最强）：配偶+子女在港常住+读书，主申频繁往返。\n- 策略二（次强）：子女在港读书+主申或配偶在港就业/经营，家庭在港有常住痕迹。\n- 策略三（最弱——不推荐）：全家均不在港常住，仅偶尔入境——永居申请被拒风险极高。\n\n### 11.4 香港 vs 内地生活对比\n\n| 维度 | 香港 | 内地一线城市 |\n|---|---|---|\n| 居住成本 | ★★★★★（全球最高） | ★★★★ |\n| 子女教育 | ★★★★★ | ★★★★ |\n| 医疗 | ★★★★ | ★★★★ |\n| 食品安全 | ★★★★★ | ★★★ |\n| 空气质量 | ★★★ | ★★★ |\n| 出行便利 | ★★★★ | ★★★★ |\n| 国际化 | ★★★★★ | ★★★★ |\n| 语言适应（普通话人群） | ★★★（粤语环境） | ★★★★★ |\n\n---\n\n## 十二、预算明细汇总\n\n### 12.1 CIES路径费用明细\n\n#### 12.1.1 基础费用（不含投资款）\n\n| 序号 | 费用项目 | 收费机构 | 金额（HKD） | 金额（RMB万元） | 付款节点 | 备注 |\n|---|---|---|---:|---:|---|---|\n| 1 | 申请费 | 入境处 | HK$5,000 | 0.46 | 提交申请时 | 一次性 |\n| 2 | 签证费（主申） | 入境处 | HK$6,000 | 0.55 | 获批后 | 一次性 |\n| 3 | 签证费（配偶+2子女） | 入境处 | HK$18,000 | 1.66 | 获批后 | 一次性 |\n| 4 | 会计师净资产报告 | 香港执业会计师 | HK$30,000-50,000 | 2.76-4.60 | 申请前 | 必须 |\n| 5 | 律师/顾问服务费 | 移民顾问/律所 | HK$300,000-500,000 | 27.60-46.00 | 签约后 | 以合同为准 |\n| 6 | 国内公证+翻译 | 公证处+翻译公司 | RMB 5,000-10,000 | 0.50-1.00 | 材料准备阶段 | 按材料量 |\n| 7 | 银行开户 | 香港银行 | HK$0-10,000 | 0-0.92 | 开立投资账户时 | 私人银行可能设最低存款 |\n| 8 | 年度投资管理 | 基金/资管公司 | 年约HK$150,000-450,000 | 年约13.80-41.40 | 每年 | 按0.5%-1.5%管理费率 |\n| 9 | 年度会计师合规报告 | 执业会计师 | 年约HK$20,000-30,000 | 年约1.84-2.76 | 每年 | CIES周年报告 |\n\n#### 12.1.2 投资款（7年锁定）\n\n| 投资类别 | 金额（HKD） | 折合RMB（万元） | 说明 |\n|---|---:|---:|---|\n| 获许金融资产投资合计 | HK$30,000,000 | 2,760.00 | 股票/债券/基金/存款证等 |\n| 其中：创新科技投资组合 | HK$3,000,000 | 276.00 | 强制配置 |\n| 其中：非住宅房地产 | ≤HK$10,000,000 | ≤920.00 | 上限1,000万 |\n\n#### 12.1.3 香港生活费用（年度参考）\n\n| 项目 | 年度预算（HKD） | 折合RMB（万元） |\n|---|---:|---:|\n| 房租（三房·九龙） | HK$600,000 | 55.20 |\n| 子女国际学校（2名） | HK$500,000 | 46.00 |\n| 菲佣（1名） | HK$60,000 | 5.52 |\n| 生活开销+交通 | HK$360,000 | 33.12 |\n| 医疗保险（四人） | HK$80,000 | 7.36 |\n| **年度合计** | **HK$1,600,000** | **147.20** |\n\n#### 12.1.4 CIES总费用汇总\n\n> 估算口径：汇率 1 HKD = 0.92 RMB；四人家庭（主申+配偶+2子女）\n\n| 费用大类 | 港币金额 | 折合RMB（万元） | 特征 |\n|---|---:|---:|---|\n| CIES获许金融资产投资 | HK$30,000,000 | 2,760.00 | 投资本金，7年后可退出 |\n| 申请+签证费（四人） | HK$29,000 | 2.67 | 一次性 |\n| 会计师+律师/顾问 | HK$330,000-550,000 | 30.36-50.60 | 一次性/分期 |\n| 公证翻译 | RMB 8,000 | 0.80 | 一次性 |\n| 7年投资管理费（估） | 约HK$1,500,000 | 约138.00 | 7年累计 |\n| 7年会计师合规报告 | 约HK$175,000 | 约16.10 | 7年累计 |\n| 7年香港生活费用 | 约HK$11,200,000 | 约1,030.40 | 7年累计 |\n| **总费用（含投资+生活）** | **—** | **约3,978** | 7年全口径 |\n| **纯身份费用（不含投资）** | **—** | **约254** | 一次性+7年年费 |\n\n### 12.2 TTPS-A路径费用汇总\n\n> 四人家庭；汇率 1 HKD = 0.92 RMB\n\n| 费用类别 | 港币金额 | 折合RMB（万元） | 说明 |\n|---|---:|---:|---|\n| TTPS网上申请费 | HK$250 | 0.02 | 一次性 |\n| 签证费（四人） | HK$24,000 | 2.21 | 一次性 |\n| 律师/顾问服务费 | HK$150,000-300,000 | 13.80-27.60 | 以合同为准 |\n| 公证/翻译 | RMB 5,000 | 0.50 | 一次性 |\n| 香港租房首年 | HK$600,000 | 55.20 | 通常居住核心 |\n| 子女国际学校首年(2名) | HK$500,000 | 46.00 | 按学校 |\n| 首年生活开销 | HK$500,000 | 46.00 | 含医疗/交通/日常 |\n| **首年总计** | **约HK$1,774,250** | **约163.33** | |\n| **纯身份办理费** | **约HK$179,250** | **约16.49** | 不含生活&教育 |\n\n### 12.3 材料清单\n\n| 序号 | 文件 | 主申 | 配偶 | 子女 | 公证/认证要求 | 备注 |\n|---|---|---|---|---|---|---|\n| 1 | 近6个月照片（白底50mm×40mm） | ✅ | ✅ | ✅ | 无 | 电子版+纸质2张 |\n| 2 | 护照/旅行证件（有效期≥6月） | ✅ | ✅ | ✅ | 无 | 1:1彩色扫描 |\n| 3 | 身份证 + 户口本 | ✅ | ✅ | ✅ | 视入境处要求 | 原件+翻译 |\n| 4 | 出生证明 | ✅ | ✅ | ✅ | 出生公证 | 派出所开局出生证明→公证处公证 |\n| 5 | 结婚证 | — | ✅ | — | 婚姻公证 | 中英文 |\n| 6 | 无犯罪记录证明 | ✅ | 视年龄 | — | 近12个月内 | 公安部门出具 |\n| 7 | CIES：净资产证明 | ✅ | — | — | 会计师审计报告 | 申请前2年持续≥HK$3,000万 |\n| 8 | TTPS-A：年收入≥HK$250万证明 | ✅ | — | — | 完税证明+银行对账单+雇主证明信 | 紧接申请前12个月 |\n| 9 | TTPS-B：百强大学学位证+成绩单 | ✅ | — | — | 教育部认证如需要 | 须在合资格大学名单内 |\n| 10 | TTPS-B：工作经验证明 | ✅ | — | — | 雇主证明信+社保记录 | ≥3年 |\n| 11 | QMAS：12条准则证明材料 | ✅ | — | — | 逐项准备 | 学历/语言/工作/收入/业务 |\n| 12 | 香港住址证明 | ✅ | — | — | 租约/买卖合约 | 通常居住证明 |\n| 13 | 资金来源说明信 | ✅ | — | — | 自制+附证明 | CIES必附 |\n\n### 12.4 三方材料清单\n\n| 责任方 | 材料/文件 | 用途 | 输出 |\n|---|---|---|---|\n| 客户 | 身份、婚姻、出生、无犯罪材料 | 基础身份文件 | 客户材料包 |\n| 客户 | CIES净资产证明+资金来源说明 | 资格与合规 | 资产报告 |\n| 客户 | TTPS/QMAS收入/学历/工作证明 | 资格证明 | 资质文件包 |\n| 香港执业会计师 | CIES审计报告 | 入境处必要材料 | 签署版审计报告 |\n| 香港移民顾问/律师 | 申请文件审核、递交、进度追踪 | 项目管理 | 案件档案 |\n| 香港银行/券商 | CIES投资账户开立+投资确认 | 完成合格投资 | 投资组合月结单 |\n| 公证/翻译机构 | 公证书、翻译件 | 材料合规 | 公证书文件包 |\n| 投资推广署 | 投资合规审核 | CIES续签+年度报告 | 合规确认函 |\n\n---\n\n## 十三、执行时间轴\n\n### 13.1 CIES完整路线图（24个月）\n\n| 月份 | 动作 | 责任方 | 里程碑/交付物 |\n|---|---|---|---|\n| 第1月 | ①客户资格审核（是否有外国永居） ②家庭信息收集 ③资金来源初审 | 顾问+客户 | 客户信息表、资格确认 |\n| 第1-2月 | ④聘请香港执业会计师 ⑤开立香港银行/投资账户 | 客户+会计师+银行 | 会计师委托书、投资账户 |\n| 第2-4月 | ⑥会计师出具净资产≥HK$3,000万审计报告 ⑦资金合规出境 | 会计师+客户+银行 | 审计报告、资金到位 |\n| 第3-4月 | ⑧完成CIES合格投资初步配置 | 客户+投资顾问+银行 | 投资组合确认 |\n| 第4月 | ⑨提交CIES申请至新资本投资者入境计划办公室 | 顾问/律师 | 受理回执 |\n| 第4-8月 | ⑩投资推广署+入境处审批 ⑪可能补件 | 入境处+客户 | 补件通知（如有） |\n| 第8月 | ⑫获原则批准→6个月内完成全部投资 | 入境处+客户 | 原则批准函 |\n| 第8-9月 | ⑬入境处正式批准→获发签证/进入许可 | 入境处 | 签证标签 |\n| 第9月 | ⑭赴港激活签证→办理香港居民身份证 | 客户 | 香港居民身份证 |\n| 第9月-第7年 | ⑮维持投资≥HK$3,000万 ⑯累积通常居住 | 客户+顾问 | 年度投资报告+年度居住记录 |\n| 每年 | ⑰提交年度投资组合报告（执业会计师签署） | 会计师+顾问 | 年度合规报告 |\n| 第2年末 | ⑱首次续签（2年→3年） | 客户+顾问 | 续签签证 |\n| 第5年末 | ⑲第二次续签（3年→3年） | 客户+顾问 | 续签签证 |\n| 第7年 | ⑳申请香港永久居民身份 | 客户+律师 | 永居审批 |\n| 第7年+ | ㉑获批永居→可申请特区护照→可撤出投资 | 客户 | 永居身份证+特区护照 |\n\n### 13.2 TTPS-A快速路线图（6个月-7年）\n\n| 时间 | 动作 | 责任方 | 交付物 |\n|---|---|---|---|\n| 第1周 | 确认年收入≥HK$250万+收集完税证明+银行对账单 | 客户+顾问 | 收入证明文件包 |\n| 第2周 | 网上递交TTPS申请 | 客户/顾问 | 申请受理编号 |\n| 第2-6周 | 入境处审批（可能补件） | 入境处 | 审批结果 |\n| 第6周 | 获批后缴费→下载电子签证 | 客户 | 电子签证 |\n| 第7周 | 赴港激活签证→办理身份证 | 客户 | 香港居民身份证 |\n| 第1-6月 | 规划在港工作/创业/安排子女学校/租房 | 客户+顾问 | 通常居住基础 |\n| 第36月 | TTPS首次续签（须已在港受雇/经营） | 客户+顾问+雇主 | 续签获批 |\n| 第72月 | TTPS第二次续签 | 同上 | 续签获批 |\n| 第84月 | 申请永居（7年） | 客户+律师 | 永居审批 |\n\n### 13.3 详细办理流程图\n\n\`\`\`text\n客户信息收集 → 入境计划通道匹配\n      ↓\n┌─────────────────────────────────────┐\n│ CIES通道：                           │\n│ ①确认外国永居资格                    │\n│ ②会计师净资产审计                    │\n│ ③香港投资账户+资金出境              │\n│ ④完成HK$3,000万合格投资             │\n│ ⑤提交CIES申请                       │\n│ ⑥投资推广署+入境处审批(6-8月)       │\n│ ⑦原则批准→6月内完成投资           │\n│ ⑧正式批准→领取签证                  │\n│ ⑨赴港激活→办理身份证                │\n└─────────────────────────────────────┘\n      ↓\n┌─────────────────────────────────────┐\n│ TTPS-A通道：                         │\n│ ①确认年收入≥HK$250万                │\n│ ②网上递交(审批约4周)                │\n│ ③获批→缴费→下载电子签证            │\n│ ④赴港激活→办理身份证                │\n└─────────────────────────────────────┘\n      ↓\n┌─────────────────────────────────────┐\n│ 7年规划（所有路径共通）：            │\n│ ①第1-3月：租房/购房+子女入学        │\n│ ②持续：通常居住+纳税+维持投资       │\n│ ③续签节点：按时续签                 │\n│ ④第7年：永居申请                    │\n└─────────────────────────────────────┘\n\`\`\`\n\n### 13.4 本周立即行动清单\n\n| 编号 | 动作 | 目的 |\n|---|---|---|\n| 1 | 确认客户是否持有任何外国永久居民身份 | CIES资格P0判断 |\n| 2 | 核实客户年收入是否≥HK$250万（TTPS-A备选） | 匹配最快路径 |\n| 3 | 确认客户学历是否为百强大学本科（TTPS-B备选） | 匹配高才通B类 |\n| 4 | 确认家庭成员年龄结构（尤其子女是否<18岁） | 随行资格 |\n| 5 | CIES客户：准备2年银行对账单+资产估值报告 | 净资产审计准备 |\n| 6 | 确认资金出境路径（ODI/境外存量/合规换汇） | P0合规 |\n| 7 | 联系香港持牌移民顾问获取最新政策确认 | 官方落地线 |\n| 8 | 建立7年时间轴管理表 | 长期规划工具 |\n\n---\n\n## 十四、重要风险声明\n\n### 14.1 居留与永居风险\n\n**香港居民身份证（非永久）不等同于香港永久居民身份证。7年"通常居住"是法定前提，仅靠偶尔入境、无实质香港生活痕迹的申请人，入境处有权拒绝永居申请。CIES路径虽续签较宽松，但永居仍需通常居住。**\n\n### 14.2 CIES投资风险\n\n**CIES获许金融资产投资须在7年内维持≥HK$3,000万。香港股票/债券市场存在波动风险，投资组合市值可能跌破门槛，客户须及时补足差额。创新科技投资组合（强制HK$300万）流动性较低，回报和退出不确定。投资本金不存在政府保本承诺。**\n\n### 14.3 CIES资格前提风险\n\n**纯中国内地居民（无任何外国永居）原则上不符合CIES申请资格。客户须先取得第三国永居，才能以"中国籍但已取得外国永久居民身份者"身份申请CIES。如客户不愿操作第三国永居，CIES不可行，须改用TTPS/QMAS等其他通道。**\n\n### 14.4 政策风险\n\n**香港入境计划政策持续调整：TTPS高才通2022年底推出后已多次优化（大学名单扩至198所、A类签证延长至36个月等），未来可能提高门槛或收紧续签审查。优才QMAS 2025年改为新综合计分制。CIES 2024年3月重启后条款和获许资产清单可能在未来调整。所有方案正式启动前必须由香港持牌顾问确认最新政策版本。**\n\n### 14.5 TTPS/QMAS续签风险\n\n**TTPS续签须证明已在港受雇（薪酬达市场水平）或已开办/参与业务。QMAS续签须证明已在港定居和对香港有贡献。仅持有身份但不在港工作/生活，可能导致续签被拒，身份中断。**\n\n### 14.6 子女教育风险\n\n**华侨生联考路径需要香港永居+回乡证，回乡证办理需注销内地户口，这是一项不可逆决定。18岁为随行子女年龄上限。国际学校学位有限，须提前1-2年申请。**\n\n### 14.7 税务风险\n\n**取得香港居民身份不等于自动改变税务居民身份。如在内地仍为主要居住地，仍为中国税务居民。内地CFC规则可能导致香港受控企业的未分配利润被当期征税。CRS信息交换机制下，香港金融机构的账户信息将自动交换至内地税务机关。**\n\n### 14.8 资金出境风险\n\n**任何地下钱庄、虚假贸易、现金搬运、第三方不明代付均属重大合规风险。CIES的净资产审计由香港执业会计师签署，虚假陈述可能构成刑事犯罪。ODI路径如不能获批，须有备选方案。**\n\n---\n\n## 附件：引用法律法规与项目资料来源\n\n### A. 本次方案引用到的法律依据清单\n\n| 法案/规则 | 条款/款项 | 本次用途 | 最新状态 | 备注 |\n|---|---|---|---|---|\n| 《入境条例》（香港法例第115章） | 第11条及其附表 | 所有入境计划的授权法源 | 现行有效 | 基本法律框架 |\n| CIES资本投资者入境计划规则 | 2024年3月1日版全文 | CIES申请、审批、投资、维持的完整规则 | 2024.3.1生效 | 投资推广署+入境处共同执行 |\n| CIES获许金融资产类别公告 | 港府2024年公布 | 界定CIES合格投资具体类别 | 2024年 | 含股票、债券、存款证、基金、非住宅房产等9大类 |\n| TTPS高端人才通行证计划 | 入境处2022.12.28公布；2024.11修订 | TTPS A/B/C类申请依据 | 2024.11修订版 | A类延长至36个月；合资格大学198所 |\n| QMAS优秀人才入境计划 | 入境处2025年修订版 | 新综合计分制(12条≥6条) | 2025年 | 取代旧评分制 |\n| ASMTP输入内地人才计划 | 入境处现行版 | 雇主担保/自雇申请依据 | 现行有效 | |\n| IANG非本地毕业生留港/回港就业安排 | 入境处现行版 | 毕业生留港依据 | 现行有效 | 含大湾区合资格校园 |\n| 《税务条例》（香港法例第112章） | 第14条(利得税)、第8条(薪俸税) | 税务分析 | 现行有效 | 地域来源原则 |\n| 《印花税条例》（香港法例第117章） | 附表1 | 股票/物业交易印花税 | 2024年撤辣修订 | 额外印花税已取消 |\n| 家族投资控股实体税务宽减条例 | 2023年第13号条例 | 家族办公室税务宽免 | 2023.5.19生效 | 合资格交易0%利得税 |\n| 《中华人民共和国国籍法》 | 第3条、第9条 | 香港身份不改变中国国籍 | 现行有效 | 香港适用 |\n| 大湾区个人所得税优惠政策 | 财税〔2023〕34号 | 港人个税超15%部分返还 | 2023年延续至2027年底 | 需在港受雇 |\n| 内地与香港避免双重征税安排 | 全文 | 税收居民判定和税收抵免 | 现行有效 | 加比规则 |\n\n### B. 多个法案之间的相互影响\n\n| 组合 | 相互影响 | 需注意 |\n|---|---|---|\n| CIES规则 + 投资维持要求 | CIES风险投资须维持7年+市值≥HK$3,000万 | 跌破门槛须补足；年度合规报告不能漏 |\n| CIES + 中国籍+外国永居 | 中国内地居民必须先取得外国永居 | 操作顺序：外国永居→CIES申请 |\n| TTPS获批 + 续签受雇/经营要求 | 首签获36个月，续签须在港就业/经营 | 第2-3年须完成在港就业/创业布局 |\n| QMAS续签 + 定居要求 | 须证明已在港定居 | 比TTPS更强调实际居住和融入 |\n| 香港永居 + 特区护照 | 永居后可申请特区护照 | 须为中国公民 |\n| 永居 + 回乡证 + 华侨生联考 | 回乡证需注销内地户口 | 不可逆选择；需全家共识 |\n| CIES + 家族办公室 | 两者可并行 | 注意家办中的资产与CIES投资资产不应重复计算 |\n| 大湾区税优 + 香港税务居民 | 税优需香港税务居民证明 | 需在港受雇+缴税 |\n\n### C. 法律适用注意事项\n\n1. **CIES资格前提不能跳过**：中国内地居民须先取得外国永久居民身份，然后才能以该身份申请CIES。可考虑低成本方案（如瓦努阿图永居）作为"资格跳板"。\n2. **通常居住是主观+客观综合判断**：入境处有较大裁量权。建议保留充分的香港生活证据，包括但不限于：租约/房产证、水电煤气账单、银行对账单、税单、子女学籍、外佣合约、驾驶证。\n3. **CIES投资不得质押**：所有投资资产须为自由资产，不得用于抵押贷款。\n4. **ASMTP自雇需真实经营**：不可用空壳公司申请；入境处审查办公场所、雇员、真实流水和审计报告。\n5. **TTPS申请人须无已知安全/刑事记录**：入境处会进行安保审查。\n6. **税务建议须独立判断**：本方案税务分析为初步框架，不构成正式税务建议。客户落地前须由香港税务师独立评估。\n7. **所有费用以签约方合同为准**：本方案预算为参考口径，实际费用以律师/顾问合同、政府最新收据、银行账单为准。\n\n### D. 交付前客户需补充与确认资料\n\n1. 客户完整家庭信息（主申+配偶+所有子女年龄及教育阶段）\n2. 是否已持有任何外国永久居民身份（英国/加拿大/澳洲/新西兰/日本/任何国家）\n3. CIES客户：最近2年全球净资产≥HK$3,000万的证明材料清单\n4. TTPS-A客户：紧接申请前12个月完税年收入≥HK$250万的证明文件\n5. TTPS-B客户：学士学位证书+成绩单+工作经验证明\n6. 客户企业股权架构图、近3年审计报告（如有企业主身份）\n7. 资金出境路径可行性评估（ODI/境外存量/其他合规方式）\n8. 子女教育方向意向（DSE/华侨生联考/国际学校+海外升学）\n9. 香港持牌移民顾问出具的最新政策确认与申请方案\n10. 7年通常居住意愿评估（是否愿意安排配偶/子女在港常住）\n"\n\n## 附录已扩充;`;
