<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" style="max-width:720px;font-family:system-ui,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b81515"/></marker></defs><rect width="720" height="260" fill="#fefafa" rx="14"/><text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#b81515">IANG非本地毕业生留港路径</text><rect x="50" y="50" width="160" height="50" rx="10" fill="#fff" stroke="#b81515" stroke-width="1.5"/><text x="130" y="67" text-anchor="middle" font-size="9" font-weight="600">港校/大湾区校园毕业</text><text x="130" y="83" text-anchor="middle" font-size="9" fill="#6b7280">学士及以上学位</text><line x1="212" y1="75" x2="248" y2="75" stroke="#b81515" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="50" width="160" height="50" rx="10" fill="#fff" stroke="#b81515" stroke-width="1.5"/><text x="330" y="67" text-anchor="middle" font-size="9" font-weight="600">毕业后6月内申请</text><text x="330" y="83" text-anchor="middle" font-size="9" fill="#6b7280">首次获批2年</text><line x1="412" y1="75" x2="448" y2="75" stroke="#b81515" stroke-width="1.5" marker-end="url(#a)"/><rect x="450" y="50" width="160" height="50" rx="10" fill="#fff" stroke="#b81515" stroke-width="1.5"/><text x="530" y="67" text-anchor="middle" font-size="9" font-weight="600">在港受雇/创业</text><text x="530" y="83" text-anchor="middle" font-size="9" fill="#6b7280">续签3+3年</text><line x1="612" y1="75" x2="648" y2="75" stroke="#b81515" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="50" width="60" height="50" rx="10" fill="#fef0f0" stroke="#b81515" stroke-width="2"/><text x="680" y="80" text-anchor="middle" font-size="9" font-weight="600">在港</text><line x1="680" y1="102" x2="680" y2="135" stroke="#b81515" stroke-width="1.5"/><line x1="680" y1="135" x2="46" y2="135" stroke="#b81515" stroke-width="1.5" marker-end="url(#a)"/><rect x="50" y="110" width="200" height="50" rx="10" fill="#fff" stroke="#b81515" stroke-width="1.5"/><text x="150" y="130" text-anchor="middle" font-size="10" font-weight="600">累积通常居住+工作</text><text x="150" y="148" text-anchor="middle" font-size="9" fill="#6b7280">7年总时间</text><line x1="252" y1="135" x2="288" y2="135" stroke="#b81515" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="110" width="200" height="50" rx="10" fill="#fef0f0" stroke="#b81515" stroke-width="2"/><text x="390" y="130" text-anchor="middle" font-size="10" font-weight="700">7年→永居申请</text><text x="390" y="148" text-anchor="middle" font-size="9" fill="#6b7280">特区护照(可选)</text></svg>
