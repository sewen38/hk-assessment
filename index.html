<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>香港移民项目资格评估</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f5f6f8;color:#1a1a1a;line-height:1.6;-webkit-text-size-adjust:100%}
.container{max-width:720px;margin:0 auto;padding:0 0 40px}
.header{background:linear-gradient(135deg,#1a3350,#2969a8);color:#fff;padding:32px 20px 28px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:22px;margin-bottom:4px}
.header p{opacity:.85;font-size:13px}
.card{background:#fff;border-radius:14px;padding:24px 18px;margin:16px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{font-size:17px;color:#1a3350;margin-bottom:16px;padding-bottom:10px;border-bottom:1.5px solid #eef1f5;display:flex;align-items:center;gap:8px}
.card h2 .num{background:#1a3350;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.fg{margin-bottom:16px}
.fg label.q{display:block;font-weight:600;font-size:14px;margin-bottom:5px;color:#333}
.fg .hint{font-size:12px;color:#999;margin-bottom:4px;font-weight:400}
.fg select,.fg input[type=text]{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;transition:border .2s;background:#fafafa;-webkit-appearance:none}
.fg select:focus,.fg input:focus{outline:none;border-color:#2969a8;background:#fff}
.detail-input{margin-top:8px;display:none}
.detail-input.show{display:block}
.detail-input input{width:100%;padding:10px 12px;border:1.5px solid #b8d8f0;border-radius:8px;font-size:14px;background:#e8f4fd}
.detail-input input::placeholder{color:#999}
.detail-input .label-sm{font-size:12px;color:#666;margin-bottom:4px;display:block}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-row .ropt{flex:1;min-width:80px;padding:10px 16px;border:1.5px solid #ddd;border-radius:8px;text-align:center;cursor:pointer;font-size:14px;background:#fafafa;transition:all .15s;user-select:none}
.radio-row .ropt:active,.radio-row .ropt.sel{border-color:#2969a8;background:#e8f4fd;font-weight:600;color:#1a3350}
.radio-row input{display:none}
.btn{display:block;width:calc(100% - 24px);margin:20px auto;padding:14px;background:linear-gradient(135deg,#1a3350,#2969a8);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.98)}

.results-wrap{display:none;margin:0 12px}
.results-wrap.show{display:block}
.rs-card{background:#fff;border-radius:14px;padding:20px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rs-card h3{font-size:18px;margin-bottom:6px;color:#1a3350}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:3px}
.tg{background:#dcfce7;color:#166534}
.ty{background:#fef3c7;color:#92400e}
.tr{background:#fee2e2;color:#991b1b}
.prog{background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:10px}
.prog.el{border-left:4px solid #22c55e}
.prog.mb{border-left:4px solid #f59e0b}
.prog.no{border-left:4px solid #e0e0e0;opacity:.85}
.prog h4{font-size:15px;margin-bottom:6px;color:#1a3350}
.prog .st{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:6px}
.st-q{background:#dcfce7;color:#166534}.st-m{background:#fef3c7;color:#92400e}.st-n{background:#fee2e2;color:#991b1b}
.prog .d{font-size:13px;color:#555;line-height:1.7}
.g{color:#166534;font-weight:600}.o{color:#c2410c;font-weight:600}
table.cm{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
table.cm th,table.cm td{border:1px solid #e2e8f0;padding:7px;text-align:center}
table.cm th{background:#f1f5f9;font-weight:600;font-size:11px}
table.cm td:first-child{text-align:left;font-weight:500}
.hb{background:#e8f4fd;border:1px solid #b8d8f0;border-radius:8px;padding:12px;margin:10px 0;font-size:13px}
.hb.w{background:#fff7ed;border-color:#fed7aa}
.btn-sm{display:inline-block;padding:10px 20px;margin:4px 0;background:#eef1f5;color:#555;border:none;border-radius:8px;font-size:13px;cursor:pointer}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#2969a8;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.choice-grid{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.choice-card{border:2px solid #ddd;border-radius:10px;padding:14px 12px;cursor:pointer;flex:1;min-width:90px;text-align:center;transition:all .15s;user-select:none}
.choice-card h4{font-size:14px;margin-bottom:4px;color:#1a3350}
.choice-card p{font-size:12px;color:#888;margin:0}
.choice-card.sel{border-color:#2969a8;background:#e8f4fd;font-weight:600}
.project-list{display:none;margin:8px 0;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.project-list.show{display:block}
.project-opt{padding:12px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:14px;transition:all .15s;user-select:none}
.project-opt:last-child{border-bottom:none}
.project-opt:hover{background:#e8f4fd}
.project-opt.sel{background:#e8f4fd;font-weight:600;color:#1a3350;border-left:3px solid #2969a8}
.flow-actions{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.flow-primary{background:linear-gradient(135deg,#1a3350,#2969a8);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.flow-primary:active{transform:scale(.97)}
.flow-secondary{background:#eef1f5;color:#555;border:none;border-radius:10px;padding:12px 28px;font-size:14px;cursor:pointer}
@media(max-width:400px){.radio-row .ropt{min-width:60px;padding:8px 12px;font-size:13px}.card{padding:18px 14px;margin:10px 8px}.header h1{font-size:19px}}
.project-check-grid{display:flex;flex-direction:column;gap:8px;margin:10px 0}.project-check{display:flex;align-items:flex-start;gap:8px;padding:12px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fafafa;cursor:pointer;font-size:13px;line-height:1.5;transition:all .15s}.project-check:has(input:checked){border-color:#22c55e;background:#f0fdf4}.project-check input[type=checkbox]{margin-top:2px;accent-color:#22c55e;width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🇭🇰 香港移民项目资格评估</h1><p>基于入境处2025-2026政策 · 约3分钟</p></div>

<form id="qform">

<div class="card"><h2><span class="num">1</span> 基本信息</h2>
<div class="fg"><label class="q">年龄</label><select id="age"><option value="">请选择</option><option value="18-30">18-30岁</option><option value="31-40">31-40岁</option><option value="41-50">41-50岁</option><option value="51+">51岁及以上</option></select></div>
<div class="fg"><label class="q">国籍/户籍</label><select id="nationality"><option value="">请选择</option><option value="cn">中国内地居民</option><option value="cn-foreign">中国籍+已取得外国永居</option><option value="mo-tw">澳门/台湾居民</option><option value="foreign">外国国民</option></select></div>
<div class="fg"><label class="q">有无犯罪记录</label><div class="radio-row"><label class="ropt"><input type="radio" name="nocrim" value="yes"> 是</label><label class="ropt"><input type="radio" name="nocrim" value="no"> 否</label></div></div>
<div class="fg"><label class="q">有无健康证明</label><div class="radio-row"><label class="ropt"><input type="radio" name="health" value="yes"> 是</label><label class="ropt"><input type="radio" name="health" value="no"> 否</label></div></div>
</div>

<div class="card"><h2><span class="num">2</span> 学历背景</h2>
<div class="fg"><label class="q">最高学历</label><select id="education"><option value="">请选择</option><option value="doctor">博士</option><option value="master">硕士</option><option value="bachelor">学士（本科）</option><option value="associate">大专/副学士</option><option value="highschool">高中及以下</option></select></div>
<div class="fg"><label class="q">毕业院校是否属于世界百强大学？<span class="hint">(QS/泰晤士/上交/US News前100，或高才通198所合资格大学)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="topuni" value="yes"> 是</label><label class="ropt"><input type="radio" name="topuni" value="no"> 否</label><label class="ropt"><input type="radio" name="topuni" value="unknown"> 不确定</label></div>
<div id="dt-topuni" class="detail-input"><span class="label-sm">毕业院校全称：</span><input type="text" id="topuni-name" placeholder="例如：北京大学 / MIT"></div></div>
<div class="fg" id="fg-stem" style="display:none"><label class="q">硕/博士是否STEM学科？<span class="hint">(科学、科技、工程、数学)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="stem" value="yes"> 是</label><label class="ropt"><input type="radio" name="stem" value="no"> 否</label></div></div>
<div class="fg"><label class="q">是否在香港取得全日制学士或以上学历？<span class="hint">(含港校大湾区校园)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="hkdegree" value="yes"> 是</label><label class="ropt"><input type="radio" name="hkdegree" value="no"> 否</label></div>
<div id="dt-hkdegree" class="detail-input"><span class="label-sm">香港院校全称：</span><input type="text" id="hkdegree-name" placeholder="例如：香港大学 / 香港中文大学"></div></div>
</div>

<div class="card"><h2><span class="num">3</span> 工作与收入</h2>
<div class="fg"><label class="q">总工作经验年限</label><select id="workyears"><option value="">请选择</option><option value="0-2">0-2年</option><option value="3-5">3-5年</option><option value="5-9">5-9年</option><option value="10+">10年及以上</option></select></div>
<div class="fg"><label class="q">是否拥有≥3年学位程度或专家水平的工作经验？</label><div class="radio-row"><label class="ropt"><input type="radio" name="exp3y" value="yes"> 是</label><label class="ropt"><input type="radio" name="exp3y" value="no"> 否</label></div>
<div id="dt-exp3y" class="detail-input"><span class="label-sm">简述（公司/职位/年限）：</span><input type="text" id="exp3y-info" placeholder="例如：阿里巴巴 高级工程师 5年"></div></div>
<div class="fg"><label class="q">是否有≥3年在跨国公司或知名企业的工作经验？<span class="hint">(上市公司/财富500强/福布斯2000强/胡润中国500强)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="mnc" value="yes"> 是</label><label class="ropt"><input type="radio" name="mnc" value="no"> 否</label></div>
<div id="dt-mnc" class="detail-input"><span class="label-sm">公司及职位：</span><input type="text" id="mnc-info" placeholder="例如：腾讯 产品总监 4年"></div></div>
<div class="fg"><label class="q">是否有≥3年在特定领域的工作经验？<span class="hint">(创新及科技/金融/国际贸易及跨境供应链)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="sector" value="yes"> 是</label><label class="ropt"><input type="radio" name="sector" value="no"> 否</label></div>
<div id="dt-sector" class="detail-input"><span class="label-sm">领域及年限：</span><input type="text" id="sector-info" placeholder="例如：金融科技 风控 5年"></div></div>
<div class="fg"><label class="q">上一年度全年收入<span class="hint">(含薪资/奖金/分红/公司利润，港元)</span></label><select id="income"><option value="">请选择</option><option value="lt1m">低于100万港元</option><option value="1m-2.5m">100万-250万港元</option><option value="gte2.5m">250万港元及以上</option></select></div>
</div>

<div class="card"><h2><span class="num">4</span> 语言能力</h2>
<div class="fg"><label class="q">中文能力<span class="hint">(普通话或粤语)</span></label><select id="chinese"><option value="">请选择</option><option value="native">母语/精通(听说读写)</option><option value="good">良好(日常沟通+书面)</option><option value="basic">基础</option><option value="none">不会</option></select></div>
<div class="fg"><label class="q">英文能力</label><select id="english"><option value="">请选择</option><option value="native">精通(雅思≥7.0/托福≥94)</option><option value="good">良好(雅思≥6.0/托福≥80)</option><option value="basic">基础</option><option value="none">不会</option></select></div>
<div class="fg"><label class="q">是否还流利掌握其他外语？</label><div class="radio-row"><label class="ropt"><input type="radio" name="otherlang" value="yes"> 是</label><label class="ropt"><input type="radio" name="otherlang" value="no"> 否</label></div>
<div id="dt-otherlang" class="detail-input"><span class="label-sm">语种及水平：</span><input type="text" id="otherlang-info" placeholder="例如：日语N1 / 法语B2"></div></div>
</div>

<div class="card"><h2><span class="num">5</span> 资产与业务</h2>
<div class="fg"><label class="q">个人净资产<span class="hint">(合并计算，港元)</span></label><select id="networth"><option value="">请选择</option><option value="lt10m">低于1,000万港元</option><option value="10m-30m">1,000万-3,000万港元</option><option value="gte30m">3,000万港元及以上</option></select></div>
<div class="fg"><label class="q">是否拥有业务实体？<span class="hint">(非上市公司持股≥50% 或 上市公司持股≥10%)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="bizowner" value="yes"> 是</label><label class="ropt"><input type="radio" name="bizowner" value="no"> 否</label></div>
<div id="fg-bizprofit" style="display:none"><label class="q">该业务上一年度全年盈利</label><select id="bizprofit"><option value="">请选择</option><option value="lt5m">低于500万港元</option><option value="gte5m">500万港元及以上</option></select></div></div>
</div>

<div class="card"><h2><span class="num">6</span> 香港雇主情况</h2>
<div class="fg"><label class="q">是否已获得香港雇主聘用？</label><div class="radio-row"><label class="ropt"><input type="radio" name="hkemp" value="yes"> 是，已获正式聘用</label><label class="ropt"><input type="radio" name="hkemp" value="no"> 否</label><label class="ropt"><input type="radio" name="hkemp" value="plan"> 计划自雇/在港创业</label></div></div>
</div>

<div class="card"><h2><span class="num">7</span> 移民意向</h2>
<div class="fg"><label class="q">主要移民目的<span class="hint">(可多选)</span></label><div class="radio-row"><label class="ropt"><input type="checkbox" name="purpose" value="work"> 工作发展</label><label class="ropt"><input type="checkbox" name="purpose" value="edu"> 子女教育</label><label class="ropt"><input type="checkbox" name="purpose" value="invest"> 资产配置</label><label class="ropt"><input type="checkbox" name="purpose" value="life"> 生活方式</label><label class="ropt"><input type="checkbox" name="purpose" value="passport"> 护照/永居</label></div></div>
<div class="fg"><label class="q">愿意投入的资金预算</label><select id="budget"><option value="">请选择</option><option value="lt50k">低于5万港元</option><option value="50k-200k">5万-20万港元</option><option value="200k-1m">20万-100万港元</option><option value="1m-10m">100万-1,000万港元</option><option value="gte30m">3,000万港元以上</option></select></div>
</div>

<button type="button" class="btn" onclick="submitForm()">📊 提交评估</button>
</form>

<div class="results-wrap" id="results"></div>
</div>

<script>
(function(){
  var D=document;
  function R(name){var e=D.querySelector('input[name="'+name+'"]:checked');return e?e.value:null;}
  function S(id){var e=D.getElementById(id);return e?e.value:'';}
  function I(id){var e=D.getElementById(id);return e?e.value.trim():'';}
  function Y(v){return v==='yes'?'是':v==='no'?'否':(v||'未填');}
  function L(id,v){var m={'age':{'18-30':'18-30岁','31-40':'31-40岁','41-50':'41-50岁','51+':'51岁及以上'},'nationality':{'cn':'中国内地居民','cn-foreign':'中国籍+已取得外国永居','mo-tw':'澳门/台湾居民','foreign':'外国国民'},'education':{'doctor':'博士','master':'硕士','bachelor':'学士（本科）','associate':'大专/副学士','highschool':'高中及以下'},'workyears':{'0-2':'0-2年','3-5':'3-5年','5-9':'5-9年','10+':'10年及以上'},'income':{'lt1m':'低于100万港元','1m-2.5m':'100万-250万港元','gte2.5m':'250万港元及以上'},'chinese':{'native':'母语/精通','good':'良好','basic':'基础','none':'不会'},'english':{'native':'精通(雅思≥7.0)','good':'良好(雅思≥6.0)','basic':'基础','none':'不会'},'networth':{'lt10m':'低于1,000万港元','10m-30m':'1,000万-3,000万港元','gte30m':'3,000万港元及以上'},'bizprofit':{'lt5m':'低于500万港元','gte5m':'500万港元及以上'},'budget':{'lt50k':'低于5万港元','50k-200k':'5万-20万港元','200k-1m':'20万-100万港元','1m-10m':'100万-1,000万港元','gte30m':'3,000万港元以上'}};return (m[id]||{})[v]||v;}

  // Radio selection
  D.querySelectorAll('input[type="radio"]').forEach(function(r){r.addEventListener('change',function(){var row=this.closest('.radio-row');row.querySelectorAll('.ropt').forEach(function(l){l.classList.remove('sel');});this.parentElement.classList.add('sel');onChange(this.name,this.value);});});
  D.querySelectorAll('input[type="checkbox"]').forEach(function(cb){cb.addEventListener('change',function(){this.parentElement.classList.toggle('sel',this.checked);});});
  D.getElementById('education').addEventListener('change',function(){D.getElementById('fg-stem').style.display=(this.value==='master'||this.value==='doctor')?'block':'none';});

  function onChange(n,v){
    if(n==='topuni')D.getElementById('dt-topuni').classList.toggle('show',v==='yes'||v==='unknown');
    if(n==='hkdegree')D.getElementById('dt-hkdegree').classList.toggle('show',v==='yes');
    if(n==='exp3y')D.getElementById('dt-exp3y').classList.toggle('show',v==='yes');
    if(n==='mnc')D.getElementById('dt-mnc').classList.toggle('show',v==='yes');
    if(n==='sector')D.getElementById('dt-sector').classList.toggle('show',v==='yes');
    if(n==='otherlang')D.getElementById('dt-otherlang').classList.toggle('show',v==='yes');
    if(n==='bizowner')D.getElementById('fg-bizprofit').style.display=v==='yes'?'block':'none';
  }

  window.submitForm=function(){
    var age=S('age'),nat=S('nationality'),nocrim=R('nocrim'),health=R('health'),edu=S('education'),topuni=R('topuni'),stem=R('stem'),hkdegree=R('hkdegree'),worky=S('workyears'),exp3=R('exp3y'),mnc=R('mnc'),sector=R('sector'),income=S('income'),chinese=S('chinese'),english=S('english'),otherlang=R('otherlang'),networth=S('networth'),bizowner=R('bizowner'),bizprofit=S('bizprofit'),hkemp=R('hkemp');
    if(!age||!nat||!nocrim||!health||!edu||!topuni||!hkdegree||!worky||!exp3||!mnc||!sector||!income||!chinese||!english||!otherlang||!networth||!bizowner||!hkemp){var m=[];if(!age)m.push('年龄');if(!nat)m.push('国籍');if(!nocrim)m.push('无犯罪记录');if(!health)m.push('健康证明');if(!edu)m.push('学历');if(!topuni)m.push('百强大学');if(!hkdegree)m.push('香港学历');if(!worky)m.push('工作经验');if(!exp3)m.push('学位经验');if(!mnc)m.push('跨国经验');if(!sector)m.push('特定领域');if(!income)m.push('年收入');if(!chinese)m.push('中文');if(!english)m.push('英文');if(!otherlang)m.push('其他外语');if(!networth)m.push('净资产');if(!bizowner)m.push('业务实体');if(!hkemp)m.push('雇主情况');alert('请完成：\n'+m.join('、'));return;}

    var w=D.getElementById('results');
    D.getElementById('qform').style.display='none';
    w.innerHTML='<div class="rs-card" style="text-align:center;padding:50px 20px"><div style="font-size:40px">📤</div><h3>已提交</h3><p style="color:#888;font-size:13px;margin:6px 0"><span class="spinner"></span>正在分析评估...</p></div>';
    w.classList.add('show');w.scrollIntoView({behavior:'smooth'});

    // Try remote submit + run local eval after short delay
