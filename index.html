<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>香港移民项目资格评估</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f5f6f8;color:#1a1a1a;line-height:1.6;-webkit-text-size-adjust:100%}
.container{max-width:720px;margin:0 auto;padding:0 0 40px}
.header{background:linear-gradient(135deg,#1a3350,#2969a8);color:#fff;padding:32px 20px 28px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:22px;margin-bottom:4px;letter-spacing:.5px}
.header p{opacity:.85;font-size:13px}
.card{background:#fff;border-radius:14px;padding:24px 18px;margin:16px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{font-size:17px;color:#1a3350;margin-bottom:16px;padding-bottom:10px;border-bottom:1.5px solid #eef1f5;display:flex;align-items:center;gap:8px}
.card h2 .num{background:#1a3350;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.fg{margin-bottom:16px}
.fg label.q{display:block;font-weight:600;font-size:14px;margin-bottom:5px;color:#333}
.fg .hint{font-size:12px;color:#999;margin-bottom:4px;font-weight:400}
.fg select,.fg input[type=text]{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;transition:border .2s;background:#fafafa;-webkit-appearance:none}
.fg select:focus,.fg input:focus{outline:none;border-color:#2969a8;background:#fff}
.detail-input{margin-top:8px;display:none}
.detail-input.show{display:block}
.detail-input input{width:100%;padding:10px 12px;border:1.5px solid #b8d8f0;border-radius:8px;font-size:14px;background:#e8f4fd}
.detail-input input::placeholder{color:#999}
.detail-input .label-sm{font-size:12px;color:#666;margin-bottom:4px;display:block}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-row .ropt{flex:1;min-width:80px;padding:10px 16px;border:1.5px solid #ddd;border-radius:8px;text-align:center;cursor:pointer;font-size:14px;background:#fafafa;transition:all .15s;user-select:none}
.radio-row .ropt:active,.radio-row .ropt.sel{border-color:#2969a8;background:#e8f4fd;font-weight:600;color:#1a3350}
.radio-row input{display:none}
.btn{display:block;width:calc(100% - 24px);margin:20px auto;padding:14px;background:linear-gradient(135deg,#1a3350,#2969a8);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:.5px}
.btn:active{transform:scale(.98)}
.btn-copy{display:block;width:calc(100% - 24px);margin:12px auto;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn-copy:active{transform:scale(.98)}
.output-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px;font-size:13px;line-height:1.8;white-space:pre-wrap;margin:12px 0;max-height:400px;overflow-y:auto;font-family:monospace}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:99;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
@media(max-width:400px){.radio-row .ropt{min-width:60px;padding:8px 12px;font-size:13px}.card{padding:18px 14px;margin:10px 8px}.header h1{font-size:19px}}
</style>
</head>
<body>
<div class="toast" id="toast">✅ 已复制，发送给顾问即可</div>
<div class="container">
<div class="header"><h1>🇭🇰 香港移民项目资格评估</h1><p>基于入境处2025-2026政策 · 填写约3分钟</p></div>

<form id="qform" onsubmit="return false">

<div class="card"><h2><span class="num">1</span> 基本信息</h2>
<div class="fg"><label class="q">年龄</label><select id="age"><option value="">请选择</option><option value="18-30">18-30岁</option><option value="31-40">31-40岁</option><option value="41-50">41-50岁</option><option value="51+">51岁及以上</option></select></div>
<div class="fg"><label class="q">国籍/户籍</label><select id="nationality"><option value="">请选择</option><option value="cn">中国内地居民</option><option value="cn-foreign">中国籍+已取得外国永居</option><option value="mo-tw">澳门/台湾居民</option><option value="foreign">外国国民</option></select></div>
<div class="fg"><label class="q">有无犯罪记录</label><div class="radio-row"><label class="ropt"><input type="radio" name="nocrim" value="yes"> 是</label><label class="ropt"><input type="radio" name="nocrim" value="no"> 否</label></div></div>
<div class="fg"><label class="q">有无健康证明</label><div class="radio-row"><label class="ropt"><input type="radio" name="health" value="yes"> 是</label><label class="ropt"><input type="radio" name="health" value="no"> 否</label></div></div>
</div>

<div class="card"><h2><span class="num">2</span> 学历背景</h2>
<div class="fg"><label class="q">最高学历</label><select id="education"><option value="">请选择</option><option value="doctor">博士</option><option value="master">硕士</option><option value="bachelor">学士（本科）</option><option value="associate">大专/副学士</option><option value="highschool">高中及以下</option></select></div>
<div class="fg"><label class="q">毕业院校是否属于世界百强大学？<span class="hint">(QS/泰晤士/上交/US News前100，或高才通198所合资格大学)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="topuni" value="yes"> 是</label><label class="ropt"><input type="radio" name="topuni" value="no"> 否</label><label class="ropt"><input type="radio" name="topuni" value="unknown"> 不确定</label></div>
<div id="topuni-detail" class="detail-input"><span class="label-sm">请填写毕业院校全称：</span><input type="text" id="topuni-name" placeholder="例如：北京大学 / MIT"></div></div>
<div class="fg" id="fg-stem" style="display:none"><label class="q">硕/博士学位是否属于STEM学科？<span class="hint">(科学、科技、工程、数学)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="stem" value="yes"> 是</label><label class="ropt"><input type="radio" name="stem" value="no"> 否</label></div></div>
<div class="fg"><label class="q">是否在香港取得全日制学士学位或更高学历？<span class="hint">(含港校大湾区校园)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="hkdegree" value="yes"> 是</label><label class="ropt"><input type="radio" name="hkdegree" value="no"> 否</label></div>
<div id="hkdegree-detail" class="detail-input"><span class="label-sm">请填写香港院校全称：</span><input type="text" id="hkdegree-name" placeholder="例如：香港大学 / 香港中文大学"></div></div>
</div>

<div class="card"><h2><span class="num">3</span> 工作与收入</h2>
<div class="fg"><label class="q">总工作经验年限</label><select id="workyears"><option value="">请选择</option><option value="0-2">0-2年</option><option value="3-5">3-5年</option><option value="5-9">5-9年</option><option value="10+">10年及以上</option></select></div>
<div class="fg"><label class="q">是否拥有≥3年学位程度或专家水平的工作经验？</label><div class="radio-row"><label class="ropt"><input type="radio" name="exp3y" value="yes"> 是</label><label class="ropt"><input type="radio" name="exp3y" value="no"> 否</label></div>
<div id="exp3y-detail" class="detail-input"><span class="label-sm">请简述相关工作经验（公司/职位/年限）：</span><input type="text" id="exp3y-info" placeholder="例如：阿里巴巴 高级工程师 5年"></div></div>
<div class="fg"><label class="q">是否有≥3年在跨国公司或知名企业的工作经验？<span class="hint">(上市公司、财富500强、福布斯2000强、胡润中国500强)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="mnc" value="yes"> 是</label><label class="ropt"><input type="radio" name="mnc" value="no"> 否</label></div>
<div id="mnc-detail" class="detail-input"><span class="label-sm">请填写公司名称及职位：</span><input type="text" id="mnc-info" placeholder="例如：腾讯 产品总监 4年"></div></div>
<div class="fg"><label class="q">是否有≥3年在特定领域的工作经验？<span class="hint">(创新及科技、金融、国际贸易及跨境供应链管理)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="sector" value="yes"> 是</label><label class="ropt"><input type="radio" name="sector" value="no"> 否</label></div>
<div id="sector-detail" class="detail-input"><span class="label-sm">请说明具体领域及年限：</span><input type="text" id="sector-info" placeholder="例如：金融科技 风控 5年"></div></div>
<div class="fg"><label class="q">上一年度全年收入<span class="hint">(含薪资、奖金、分红、公司利润，港元)</span></label><select id="income"><option value="">请选择</option><option value="lt1m">低于100万港元</option><option value="1m-2.5m">100万-250万港元</option><option value="gte2.5m">250万港元及以上</option></select></div>
</div>

<div class="card"><h2><span class="num">4</span> 语言能力</h2>
<div class="fg"><label class="q">中文能力<span class="hint">(普通话或粤语)</span></label><select id="chinese"><option value="">请选择</option><option value="native">母语/精通(听说读写)</option><option value="good">良好(日常沟通+书面)</option><option value="basic">基础</option><option value="none">不会</option></select></div>
<div class="fg"><label class="q">英文能力</label><select id="english"><option value="">请选择</option><option value="native">精通(雅思≥7.0/托福≥94/六级≥520)</option><option value="good">良好(雅思≥6.0/托福≥80/六级≥430)</option><option value="basic">基础</option><option value="none">不会</option></select></div>
<div class="fg"><label class="q">是否还流利掌握其他外语？</label><div class="radio-row"><label class="ropt"><input type="radio" name="otherlang" value="yes"> 是</label><label class="ropt"><input type="radio" name="otherlang" value="no"> 否</label></div>
<div id="otherlang-detail" class="detail-input"><span class="label-sm">请填写掌握的外语语种及水平：</span><input type="text" id="otherlang-info" placeholder="例如：日语N1 / 法语B2"></div></div>
</div>

<div class="card"><h2><span class="num">5</span> 资产与业务</h2>
<div class="fg"><label class="q">个人净资产<span class="hint">(合并计算，港元)</span></label><select id="networth"><option value="">请选择</option><option value="lt10m">低于1,000万港元</option><option value="10m-30m">1,000万-3,000万港元</option><option value="gte30m">3,000万港元及以上</option></select></div>
<div class="fg"><label class="q">是否拥有业务实体？<span class="hint">(非上市公司持股≥50% 或 上市公司持股≥10%)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="bizowner" value="yes"> 是</label><label class="ropt"><input type="radio" name="bizowner" value="no"> 否</label></div>
<div id="fg-bizprofit" style="display:none"><label class="q">该业务上一年度全年盈利</label><select id="bizprofit"><option value="">请选择</option><option value="lt5m">低于500万港元</option><option value="gte5m">500万港元及以上</option></select></div></div>
</div>

<div class="card"><h2><span class="num">6</span> 香港雇主情况</h2>
<div class="fg"><label class="q">是否已获得香港雇主聘用？</label><div class="radio-row"><label class="ropt"><input type="radio" name="hkemp" value="yes"> 是，已获正式聘用</label><label class="ropt"><input type="radio" name="hkemp" value="no"> 否</label><label class="ropt"><input type="radio" name="hkemp" value="plan"> 计划自雇/在港创业</label></div></div>
</div>

<div class="card"><h2><span class="num">7</span> 移民意向</h2>
<div class="fg"><label class="q">主要移民目的<span class="hint">(可多选)</span></label><div class="radio-row"><label class="ropt"><input type="checkbox" name="purpose" value="work"> 工作发展</label><label class="ropt"><input type="checkbox" name="purpose" value="edu"> 子女教育</label><label class="ropt"><input type="checkbox" name="purpose" value="invest"> 资产配置/投资</label><label class="ropt"><input type="checkbox" name="purpose" value="life"> 生活方式</label><label class="ropt"><input type="checkbox" name="purpose" value="passport"> 香港护照/永居</label></div></div>
<div class="fg"><label class="q">愿意投入的资金预算</label><select id="budget"><option value="">请选择</option><option value="lt50k">低于5万港元</option><option value="50k-200k">5万-20万港元</option><option value="200k-1m">20万-100万港元</option><option value="1m-10m">100万-1,000万港元</option><option value="gte30m">3,000万港元以上</option></select></div>
</div>

<button type="button" class="btn" id="submit-btn" onclick="submitForm()">📤 提交评估</button>
</form>

<div id="output-area" style="display:none;margin:0 12px">
<div class="card" style="text-align:center;border-left:4px solid #22c55e">
<h2 style="border:none;margin-bottom:8px;color:#166534">✅ 已提交</h2>
<p style="font-size:14px;color:#555;margin-bottom:12px">请复制下方数据，发送给顾问进行分析</p>
<div class="output-box" id="output-text"></div>
<button class="btn-copy" onclick="copyOutput()">📋 一键复制，发送给顾问</button>
<button class="btn-sm" onclick="resetForm()" style="margin-top:8px">🔄 重新填写</button>
<p style="font-size:12px;color:#999;margin-top:10px">复制后在飞书中粘贴发送，AI顾问将立即分析并返回评估结果</p>
</div>
</div>
</div>

<script>
// Radio selection
document.querySelectorAll('input[type="radio"]').forEach(r=>{
  r.addEventListener('change',function(){
    const row=this.closest('.radio-row');
    row.querySelectorAll('.ropt').forEach(l=>l.classList.remove('sel'));
    this.parentElement.classList.add('sel');
    onRadioChange(this.name,this.value);
  });
});
// Checkbox
document.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
  cb.addEventListener('change',function(){this.parentElement.classList.toggle('sel',this.checked);});
});
// Select
document.getElementById('education').addEventListener('change',function(){
  document.getElementById('fg-stem').style.display=(this.value==='master'||this.value==='doctor')?'block':'none';
});

function onRadioChange(name,val){
  if(name==='topuni')document.getElementById('topuni-detail').classList.toggle('show',val==='yes'||val==='unknown');
  if(name==='hkdegree')document.getElementById('hkdegree-detail').classList.toggle('show',val==='yes');
  if(name==='exp3y')document.getElementById('exp3y-detail').classList.toggle('show',val==='yes');
  if(name==='mnc')document.getElementById('mnc-detail').classList.toggle('show',val==='yes');
  if(name==='sector')document.getElementById('sector-detail').classList.toggle('show',val==='yes');
  if(name==='otherlang')document.getElementById('otherlang-detail').classList.toggle('show',val==='yes');
  if(name==='bizowner')document.getElementById('fg-bizprofit').style.display=val==='yes'?'block':'none';
}

function gv(n){var e=document.querySelector('input[name="'+n+'"]:checked');return e?e.value:null;}
function gs(id){var e=document.getElementById(id);return e?e.value:'';}
function gi(id){var e=document.getElementById(id);return e?e.value.trim():'';}

function labelLookup(id,val){
  var l={age:{'18-30':'18-30岁','31-40':'31-40岁','41-50':'41-50岁','51+':'51岁及以上'},
    nationality:{'cn':'中国内地居民','cn-foreign':'中国籍+已取得外国永居','mo-tw':'澳门/台湾居民','foreign':'外国国民'},
    education:{'doctor':'博士','master':'硕士','bachelor':'学士（本科）','associate':'大专/副学士','highschool':'高中及以下'},
    workyears:{'0-2':'0-2年','3-5':'3-5年','5-9':'5-9年','10+':'10年及以上'},
    income:{'lt1m':'低于100万港元','1m-2.5m':'100万-250万港元','gte2.5m':'250万港元及以上'},
    chinese:{'native':'母语/精通','good':'良好','basic':'基础','none':'不会'},
    english:{'native':'精通(雅思≥7.0)','good':'良好(雅思≥6.0)','basic':'基础','none':'不会'},
    networth:{'lt10m':'低于1,000万港元','10m-30m':'1,000万-3,000万港元','gte30m':'3,000万港元及以上'},
    bizprofit:{'lt5m':'低于500万港元','gte5m':'500万港元及以上'},
    budget:{'lt50k':'低于5万港元','50k-200k':'5万-20万港元','200k-1m':'20万-100万港元','1m-10m':'100万-1,000万港元','gte30m':'3,000万港元以上'}};
  return (l[id]||{})[val]||val;
}

function yn(v){return v==='yes'?'是':v==='no'?'否':(v||'未填');}

function submitForm(){
  var age=gs('age'),nat=gs('nationality'),nocrim=gv('nocrim'),health=gv('health'),edu=gs('education'),topuni=gv('topuni'),stem=gv('stem'),hkdegree=gv('hkdegree'),worky=gs('workyears'),exp3=gv('exp3y'),mnc=gv('mnc'),sector=gv('sector'),income=gs('income'),chinese=gs('chinese'),english=gs('english'),otherlang=gv('otherlang'),networth=gs('networth'),bizowner=gv('bizowner'),bizprofit=gs('bizprofit'),hkemp=gv('hkemp');
  
  if(!age||!nat||!nocrim||!health||!edu||!topuni||!hkdegree||!worky||!exp3||!mnc||!sector||!income||!chinese||!english||!otherlang||!networth||!bizowner||!hkemp){
    var m=[];if(!age)m.push('年龄');if(!nat)m.push('国籍');if(!nocrim)m.push('无犯罪记录');if(!health)m.push('健康证明');if(!edu)m.push('学历');if(!topuni)m.push('百强大学');if(!hkdegree)m.push('香港学历');if(!worky)m.push('工作经验');if(!exp3)m.push('学位经验');if(!mnc)m.push('跨国经验');if(!sector)m.push('特定领域');if(!income)m.push('年收入');if(!chinese)m.push('中文');if(!english)m.push('英文');if(!otherlang)m.push('其他外语');if(!networth)m.push('净资产');if(!bizowner)m.push('业务实体');if(!hkemp)m.push('雇主情况');
    alert('请完成以下必填项：\n'+m.join('、'));return;
  }
  
  var purposes=[];document.querySelectorAll('input[name="purpose"]:checked').forEach(c=>purposes.push({work:'工作发展',edu:'子女教育',invest:'资产配置/投资',life:'生活方式',passport:'香港护照/永居'}[c.value]||c.value));
  var hkempLabel={yes:'是，已获正式聘用',no:'否',plan:'计划自雇/在港创业'}[hkemp]||hkemp;
  
  var out='══════════════════════════\n';
  out+='  香港移民项目资格评估数据\n';
  out+='══════════════════════════\n\n';
  out+='【基本信息】\n';
  out+='年龄：'+labelLookup('age',age)+'\n';
  out+='国籍/户籍：'+labelLookup('nationality',nat)+'\n';
  out+='无犯罪记录：'+yn(nocrim)+'\n';
  out+='健康证明：'+yn(health)+'\n\n';
  out+='【学历背景】\n';
  out+='最高学历：'+labelLookup('education',edu)+'\n';
  out+='百强大学：'+yn(topuni)+(topuni==='yes'||topuni==='unknown'?' ('+(gi('topuni-name')||'未填')+')':'')+'\n';
  if(edu==='master'||edu==='doctor')out+='STEM学科：'+yn(stem||'未选')+'\n';
  out+='香港全日制学历：'+yn(hkdegree)+(hkdegree==='yes'?' ('+(gi('hkdegree-name')||'未填')+')':'')+'\n\n';
  out+='【工作与收入】\n';
  out+='总工作经验：'+labelLookup('workyears',worky)+'\n';
  out+='≥3年学位经验：'+yn(exp3)+(exp3==='yes'?' ('+(gi('exp3y-info')||'未填')+')':'')+'\n';
  out+='≥3年跨国公司经验：'+yn(mnc)+(mnc==='yes'?' ('+(gi('mnc-info')||'未填')+')':'')+'\n';
  out+='≥3年特定领域经验：'+yn(sector)+(sector==='yes'?' ('+(gi('sector-info')||'未填')+')':'')+'\n';
  out+='年收入：'+labelLookup('income',income)+'\n\n';
  out+='【语言能力】\n';
  out+='中文：'+labelLookup('chinese',chinese)+'\n';
  out+='英文：'+labelLookup('english',english)+'\n';
  out+='其他外语：'+yn(otherlang)+(otherlang==='yes'?' ('+(gi('otherlang-info')||'未填')+')':'')+'\n\n';
  out+='【资产与业务】\n';
  out+='净资产：'+labelLookup('networth',networth)+'\n';
  out+='业务实体：'+yn(bizowner)+(bizowner==='yes'&&bizprofit?' | 盈利：'+labelLookup('bizprofit',bizprofit):'')+'\n\n';
  out+='【香港雇主】\n';
  out+='雇主情况：'+hkempLabel+'\n\n';
  out+='【移民意向】\n';
  out+='目的：'+(purposes.length>0?purposes.join('、'):'未选')+'\n';
  out+='预算：'+labelLookup('budget',gs('budget'))+'\n';
  out+='══════════════════════════';
  
  document.getElementById('output-text').textContent=out;
  document.getElementById('qform').style.display='none';
  var outArea=document.getElementById('output-area');
  outArea.style.display='block';
  
  // Show submitting state
  outArea.innerHTML='<div class="card" style="text-align:center;border-left:4px solid #2969a8;padding:40px 20px"><h3 style="color:#1a3350">📤 正在提交评估数据...</h3><p style="color:#888;font-size:13px">AI正在接收并分析您的信息</p></div>';
  outArea.scrollIntoView({behavior:'smooth'});
  
  // Build data object
  var submitData={
    age:labelLookup('age',age),nationality:labelLookup('nationality',nat),
    nocrim:yn(nocrim),health:yn(health),
    education:labelLookup('education',edu),topuni:yn(topuni)+(topuni==='yes'||topuni==='unknown'?' ('+gi('topuni-name')+')':''),
    stem:(edu==='master'||edu==='doctor')?yn(stem||'未选'):'不适用',
    hkdegree:yn(hkdegree)+(hkdegree==='yes'?' ('+gi('hkdegree-name')+')':''),
    workyears:labelLookup('workyears',worky),
    exp3y:yn(exp3)+(exp3==='yes'?' ('+gi('exp3y-info')+')':''),
    mnc:yn(mnc)+(mnc==='yes'?' ('+gi('mnc-info')+')':''),
    sector:yn(sector)+(sector==='yes'?' ('+gi('sector-info')+')':''),
    income:labelLookup('income',income),
    chinese:labelLookup('chinese',chinese),english:labelLookup('english',english),
    otherlang:yn(otherlang)+(otherlang==='yes'?' ('+gi('otherlang-info')+')':''),
    networth:labelLookup('networth',networth),
    bizowner:yn(bizowner)+(bizowner==='yes'&&gs('bizprofit')?' | 盈利:'+labelLookup('bizprofit',gs('bizprofit')):''),
    hkemp:hkempLabel,
    purposes:purposes.join('、')||'未选',
    budget:labelLookup('budget',gs('budget'))
  };
  
  // Try to POST data to server
  fetch('https://5e57602670d4f3ea-113-106-113-62.serveousercontent.com/submit',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(submitData)
  }).then(function(r){return r.json();}).then(function(r){
    outArea.innerHTML='<div class="card" style="text-align:center;border-left:4px solid #22c55e;padding:40px 20px"><div style="font-size:40px">✅</div><h3 style="color:#166534;margin:10px 0 6px">已提交成功</h3><p style="color:#555;font-size:14px">AI顾问正在分析，稍后回复评估结果</p><p style="color:#999;font-size:12px;margin-top:10px">提交ID: '+r.id+'</p><button class="btn-sm" onclick="resetForm()" style="margin-top:16px">🔄 重新填写</button></div>';
  }).catch(function(e){
    // Fallback: show copy mode
    var out='══════════════\n 香港移民评估数据\n══════════════\n\n';
    out+=Object.keys(submitData).map(function(k){return k+': '+submitData[k];}).join('\n');
    out+='\n══════════════';
    document.getElementById('output-text').textContent=out;
    outArea.innerHTML='<div class="card" style="text-align:center;border-left:4px solid #f59e0b;padding:30px 18px"><h3 style="color:#92400e">⚠️ 自动提交暂不可用</h3><p style="font-size:13px;color:#555;margin:8px 0">请复制下方数据手动发送给顾问</p><div class="output-box" id="output-text" style="text-align:left"></div><button class="btn-copy" onclick="copyOutput()">📋 一键复制，发送给顾问</button><button class="btn-sm" onclick="resetForm()" style="margin-top:8px">🔄 重新填写</button></div>';
    document.getElementById('output-text').textContent=out;
  });
}

function copyOutput(){
  var t=document.getElementById('output-text').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){showToast();});}
  else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast();}
}

function showToast(){var e=document.getElementById('toast');e.classList.add('show');setTimeout(function(){e.classList.remove('show');},2000);}

function resetForm(){
  document.getElementById('output-area').style.display='none';
  document.getElementById('qform').style.display='block';
  document.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(function(r){r.checked=false;r.parentElement.classList.remove('sel');});
  document.querySelectorAll('select').forEach(function(s){s.selectedIndex=0;});
  document.querySelectorAll('.detail-input').forEach(function(d){d.classList.remove('show');});
  document.getElementById('fg-stem').style.display='none';
  document.getElementById('fg-bizprofit').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
